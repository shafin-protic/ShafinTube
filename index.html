<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Shafin Tube</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000000'/><rect x='15' y='25' width='70' height='50' rx='8' fill='%231a1a1a' stroke='%232a2a2a' stroke-width='2'/><rect x='35' y='38' width='30' height='24' rx='4' fill='%23ff0000'/><circle cx='50' cy='50' r='6' fill='%23ffffff'/></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0a0a0a;
            --bg2: #111111;
            --bg3: #1a1a1a;
            --bg4: #222222;
            --text: #f0f0f0;
            --text2: #999999;
            --border: #1e1e1e;
            --shadow: rgba(0,0,0,0.6);
            --card-bg: #0d0d0d;
            --hover: #1e1e1e;
            --accent: #ff0000;
            --accent2: #cc0000;
            --accent-glow: rgba(255,0,0,0.15);
            --radius: 8px;
            --transition: 0.2s ease;
        }
        [data-theme="light"] {
            --bg: #f0f0f0;
            --bg2: #e8e8e8;
            --bg3: #dddddd;
            --bg4: #cccccc;
            --text: #111111;
            --text2: #555555;
            --border: #cccccc;
            --shadow: rgba(0,0,0,0.08);
            --card-bg: #f8f8f8;
            --hover: #e0e0e0;
            --accent: #e60000;
            --accent2: #b30000;
            --accent-glow: rgba(230,0,0,0.1);
        }
        html, body { height: 100%; overflow: hidden; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; transition: background var(--transition), color var(--transition); }
        .app { display: flex; flex-direction: column; height: 100vh; max-width: 100vw; overflow: hidden; }
        
        .header { background: var(--bg2); padding: 6px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; min-height: 44px; gap: 6px; flex-wrap: nowrap; }
        .logo-area { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .logo-img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--bg3); flex-shrink: 0; }
        .logo-text { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
        .logo-text span { color: var(--accent); }
        
        .header-center { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: center; flex-wrap: nowrap; overflow: hidden; }
        .manual-input-wrap { display: flex; align-items: center; gap: 3px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 1px 4px 1px 12px; flex-shrink: 1; max-width: 280px; min-width: 120px; }
        .manual-input-wrap input { background: transparent; border: none; color: var(--text); font-size: 0.6rem; outline: none; padding: 4px 0; width: 100%; min-width: 60px; }
        .manual-input-wrap input::placeholder { color: var(--text2); }
        .manual-input-wrap .play-btn { background: var(--accent); border: none; color: #fff; padding: 2px 12px; border-radius: 16px; cursor: pointer; font-size: 0.55rem; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
        .manual-input-wrap .play-btn:hover { background: var(--accent2); }
        
        .header-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; flex-wrap: nowrap; }
        .header-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; transition: all var(--transition); text-decoration: none; flex-shrink: 0; }
        .header-btn:hover { background: var(--bg4); transform: scale(1.05); }
        .header-btn.random-btn { font-size: 0.85rem; background: var(--bg3); border-color: var(--border); color: var(--text); }
        .header-btn.random-btn:hover { background: var(--bg4); }
        .header-btn.random-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }
        .header-btn.random-btn.active:hover { background: var(--accent2); }
        .header-btn.history-btn { font-size: 0.85rem; }
        .header-btn.translate-btn { font-size: 0.75rem; background: var(--bg3); border-color: var(--border); color: var(--text); }
        .header-btn.translate-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .header-btn.translate-btn.active:hover { background: var(--accent2); }
        .header-btn.refresh-btn { font-size: 0.85rem; }
        .header-btn.refresh-btn:hover { transform: rotate(60deg); }
        
        .status-badge { font-size: 0.5rem; color: var(--text2); background: var(--bg3); padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); white-space: nowrap; flex-shrink: 0; }
        
        .timer-display { 
            font-size: 0.6rem; 
            font-weight: 600; 
            color: var(--text2); 
            background: var(--bg3); 
            padding: 2px 8px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            min-width: 40px; 
            text-align: center; 
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .timer-display.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
        
        .timer-preset-wrap { position: relative; display: inline-flex; align-items: center; flex-shrink: 0; }
        .timer-preset-btn { 
            padding: 2px 10px; height: 28px; border-radius: 16px; font-size: 0.55rem; font-weight: 500;
            background: var(--bg3); border: 1px solid var(--border); color: var(--text2); 
            display: inline-flex; align-items: center; justify-content: center; gap: 3px;
            cursor: pointer; transition: all var(--transition); white-space: nowrap; min-width: 36px;
        }
        .timer-preset-btn:hover { background: var(--bg4); color: var(--text); }
        .timer-preset-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }
        .timer-preset-btn.active:hover { background: var(--accent2); }
        
        .timer-preset-dropdown { 
            position: absolute; top: 34px; left: 50%; transform: translateX(-50%); 
            background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; 
            padding: 4px 0; min-width: 80px; display: none; flex-direction: column; 
            box-shadow: 0 8px 30px var(--shadow); z-index: 100; 
        }
        .timer-preset-dropdown.open { display: flex; }
        .timer-preset-dropdown .preset-option { 
            padding: 5px 14px; font-size: 0.6rem; color: var(--text2); cursor: pointer; 
            transition: all var(--transition); border: none; background: transparent; text-align: center; 
        }
        .timer-preset-dropdown .preset-option:hover { background: var(--bg4); color: var(--text); }
        .timer-preset-dropdown .preset-option.active { color: var(--accent); }
        .timer-preset-dropdown .preset-option.off { border-top: 1px solid var(--border); margin-top: 3px; padding-top: 6px; color: var(--text2); }
        .timer-preset-dropdown .preset-option.off:hover { color: var(--text); }
        
        .clock-tile { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; 
            padding: 1px 10px; min-width: 85px; width: 85px; min-height: 34px;
            flex-shrink: 0; line-height: 1.2; text-align: center;
        }
        .clock-tile .time { font-size: 0.7rem; font-weight: 600; color: var(--text); letter-spacing: 0.3px; font-variant-numeric: tabular-nums; }
        .clock-tile .day { font-size: 0.45rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.2px; }
        
        .main-content { display: flex; flex: 1; overflow: hidden; min-height: 0; }
        
        .sidebar { width: 380px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        .sidebar-header { padding: 6px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
        .sidebar-search { flex: 1; min-width: 100px; padding: 5px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 0.7rem; outline: none; }
        .sidebar-search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
        .sidebar-search::placeholder { color: var(--text2); }
        .back-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 3px 10px; border-radius: 20px; cursor: pointer; font-size: 0.65rem; display: none; align-items: center; gap: 4px; flex-shrink: 0; }
        .back-btn:hover { background: var(--bg4); }
        .back-btn.show { display: flex; }
        
        .list-container { flex: 1; overflow-y: auto; padding: 4px 6px; -webkit-overflow-scrolling: touch; }
        .list-container::-webkit-scrollbar { width: 4px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
        
        .list-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 1px 0; border-radius: var(--radius); cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; position: relative; }
        .list-item:hover { background: var(--hover); }
        .list-item.active { background: var(--bg3); border-left-color: var(--accent); }
        .list-item .thumb { width: 40px; height: 22px; border-radius: 4px; background: var(--bg3); flex-shrink: 0; object-fit: cover; }
        .list-item .info { flex: 1; min-width: 0; }
        .list-item .title { font-size: 0.75rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); cursor: default; }
        .list-item .title[title] { cursor: help; }
        .list-item .sub { font-size: 0.55rem; color: var(--text2); margin-top: 1px; }
        .list-item .badge { font-size: 0.5rem; background: var(--bg4); padding: 1px 8px; border-radius: 12px; color: var(--text2); flex-shrink: 0; margin-left: auto; }
        .list-item .video-count { font-size: 0.55rem; color: var(--text2); padding-left: 6px; flex-shrink: 0; margin-left: auto; }
        .list-item .loading-spinner { width: 14px; height: 14px; border: 2px solid var(--bg4); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .list-item .translated-badge { font-size: 0.5rem; background: var(--accent-glow); color: var(--accent); padding: 1px 6px; border-radius: 12px; flex-shrink: 0; border: 1px solid var(--accent); }
        
        .player-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; overflow: hidden; }
        .video-container { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
        .video-container iframe { width: 100%; height: 100%; border: none; transition: opacity 0.3s ease; }
        .video-container .placeholder { color: var(--text2); font-size: 0.85rem; text-align: center; padding: 20px; }
        .video-container .placeholder .big-icon { font-size: 2.5rem; display: block; margin-bottom: 10px; }
        .video-container .blank { display: none; width: 100%; height: 100%; background: #000; }
        .video-container .blank.show { display: block; }
        
        .radio-visualizer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a0a 50%, #0a0a0a 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            gap: 16px; padding: 20px; z-index: 5;
        }
        .radio-visualizer.active { display: flex; }
        .radio-visualizer .radio-icon { font-size: 3.5rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        .radio-visualizer .radio-title { font-size: 1rem; font-weight: 500; color: var(--text); text-align: center; max-width: 80%; }
        .radio-visualizer .radio-sub { font-size: 0.65rem; color: var(--text2); text-align: center; }
        .radio-visualizer .equalizer { display: flex; gap: 3px; align-items: center; justify-content: center; height: 35px; }
        .radio-visualizer .equalizer-bar { width: 3px; background: var(--accent); border-radius: 2px; animation: equalize 1.2s infinite ease-in-out; }
        .radio-visualizer .equalizer-bar:nth-child(1) { animation-delay: 0s; height: 10px; }
        .radio-visualizer .equalizer-bar:nth-child(2) { animation-delay: 0.2s; height: 20px; }
        .radio-visualizer .equalizer-bar:nth-child(3) { animation-delay: 0.4s; height: 6px; }
        .radio-visualizer .equalizer-bar:nth-child(4) { animation-delay: 0.6s; height: 26px; }
        .radio-visualizer .equalizer-bar:nth-child(5) { animation-delay: 0.8s; height: 14px; }
        .radio-visualizer .equalizer-bar:nth-child(6) { animation-delay: 1.0s; height: 8px; }
        .radio-visualizer .equalizer-bar:nth-child(7) { animation-delay: 1.2s; height: 18px; }
        .radio-visualizer .equalizer-bar:nth-child(8) { animation-delay: 0.3s; height: 12px; }
        @keyframes equalize { 0%, 100% { height: 6px; } 50% { height: 26px; } }
        
        .radio-visualizer.paused .equalizer-bar { animation-play-state: paused !important; }
        .radio-visualizer.paused .radio-icon { animation-play-state: paused !important; }
        
        .controls { background: var(--bg2); padding: 8px 14px; display: flex; align-items: center; justify-content: center; gap: 10px; border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
        .control-btn { width: 34px; height: 34px; border-radius: 50%; font-size: 0.85rem; background: var(--bg3); border: 1px solid var(--border); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition); flex-shrink: 0; }
        .control-btn:hover { background: var(--bg4); transform: scale(1.05); }
        .control-btn:active { transform: scale(0.94); }
        .control-btn.shuffle-btn { background: var(--bg3); border-color: var(--border); color: var(--text); }
        .control-btn.shuffle-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }
        .control-btn.shuffle-btn.active:hover { background: var(--accent2); }
        .control-btn.random-btn { background: var(--bg3); border-color: var(--border); color: var(--text); font-size: 0.85rem; }
        .control-btn.random-btn:hover { background: var(--bg4); }
        .control-btn.random-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }
        .control-btn.random-btn.active:hover { background: var(--accent2); }
        .control-btn.mute-btn { background: var(--bg3); border-color: var(--border); color: var(--text); font-size: 0.75rem; }
        .control-btn.mute-btn:hover { background: var(--bg4); }
        .control-btn.mute-btn.muted { background: var(--accent); border-color: var(--accent); color: #fff; }
        .control-btn.mute-btn.muted:hover { background: var(--accent2); }
        
        .mode-switch { display: flex; align-items: center; gap: 4px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 2px; flex-shrink: 0; }
        .mode-switch .mode-option { padding: 4px 12px; border-radius: 18px; font-size: 0.6rem; font-weight: 500; cursor: pointer; transition: all var(--transition); color: var(--text2); background: transparent; border: none; }
        .mode-switch .mode-option:hover { color: var(--text); }
        .mode-switch .mode-option.active { background: var(--accent); color: #fff; box-shadow: 0 0 12px var(--accent-glow); }
        .mode-switch .mode-option.active:hover { background: var(--accent2); }
        
        .player-info-text { font-size: 0.65rem; color: var(--text2); flex: 1; min-width: 60px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-timer { font-size: 0.6rem; color: var(--text2); font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; flex-shrink: 0; }
        
        .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--bg3); color: var(--text); padding: 5px 14px; border-radius: 25px; font-size: 0.65rem; border: 1px solid var(--border); z-index: 2000; animation: toastIn 0.3s ease; max-width: 90%; text-align: center; box-shadow: 0 8px 24px var(--shadow); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .toast.hidden { display: none; }
        
        .history-panel { position: fixed; top: 0; right: -400px; width: 400px; height: 100%; background: var(--bg2); border-left: 1px solid var(--border); z-index: 3000; transition: right 0.3s ease; display: flex; flex-direction: column; overflow: hidden; box-shadow: -8px 0 30px var(--shadow); }
        .history-panel.open { right: 0; }
        .history-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .history-header h3 { font-size: 0.9rem; font-weight: 600; }
        .history-header .close-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
        .history-header .close-btn:hover { background: var(--bg4); }
        .history-list { flex: 1; overflow-y: auto; padding: 8px; }
        .history-list .empty { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 0.75rem; }
        .history-date-group { margin-bottom: 12px; }
        .history-date-group .date-label { font-size: 0.7rem; font-weight: 600; color: var(--text2); padding: 4px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
        .history-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
        .history-item:hover { background: var(--hover); }
        .history-item .thumb { width: 42px; height: 24px; border-radius: 4px; background: var(--bg3); flex-shrink: 0; object-fit: cover; }
        .history-item .info { flex: 1; min-width: 0; }
        .history-item .title { font-size: 0.72rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item .sub { font-size: 0.55rem; color: var(--text2); }
        .history-item .count-badge { font-size: 0.5rem; background: var(--bg4); padding: 1px 8px; border-radius: 12px; color: var(--text2); flex-shrink: 0; }
        .history-item .position-badge { font-size: 0.5rem; background: var(--accent-glow); color: var(--accent); padding: 1px 6px; border-radius: 12px; flex-shrink: 0; border: 1px solid var(--accent); }
        
        .history-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2999; display: none; }
        .history-overlay.open { display: block; }
        
        @media (max-width: 768px) {
            .sidebar { width: 300px; }
            .header { padding: 4px 8px; min-height: 38px; gap: 4px; }
            .logo-text { font-size: 0.8rem; }
            .logo-img { width: 24px; height: 24px; }
            .header-btn { width: 24px; height: 24px; font-size: 0.65rem; }
            .clock-tile { min-width: 72px; width: 72px; min-height: 28px; padding: 1px 6px; }
            .clock-tile .time { font-size: 0.6rem; }
            .clock-tile .day { font-size: 0.4rem; }
            .manual-input-wrap { max-width: 180px; min-width: 90px; }
            .manual-input-wrap input { font-size: 0.5rem; }
            .manual-input-wrap .play-btn { font-size: 0.45rem; padding: 1px 8px; }
            .timer-display { font-size: 0.5rem; min-width: 34px; padding: 1px 6px; }
            .timer-preset-btn { font-size: 0.5rem; padding: 2px 8px; height: 24px; min-width: 32px; }
            .status-badge { font-size: 0.45rem; padding: 1px 6px; }
            .list-item .thumb { width: 34px; height: 19px; }
            .list-item .title { font-size: 0.7rem; }
            .control-btn { width: 30px; height: 30px; font-size: 0.75rem; }
            .mode-switch .mode-option { font-size: 0.55rem; padding: 3px 10px; }
            .player-info-text { font-size: 0.55rem; min-width: 40px; }
            .player-timer { font-size: 0.5rem; min-width: 50px; }
            .history-panel { width: 340px; right: -340px; }
            .radio-visualizer .radio-icon { font-size: 3rem; }
            .radio-visualizer .radio-title { font-size: 0.9rem; }
            .timer-preset-dropdown { top: 30px; min-width: 70px; }
            .timer-preset-dropdown .preset-option { font-size: 0.55rem; padding: 4px 10px; }
        }
        @media (max-width: 480px) {
            .sidebar { width: 240px; }
            .sidebar-header { padding: 4px 6px; }
            .sidebar-search { font-size: 0.6rem; padding: 3px 8px; min-width: 60px; }
            .list-item { padding: 4px 6px; gap: 5px; }
            .list-item .title { font-size: 0.65rem; }
            .list-item .sub { font-size: 0.5rem; }
            .list-item .thumb { width: 30px; height: 17px; }
            .controls { gap: 6px; padding: 6px 8px; }
            .control-btn { width: 28px; height: 28px; font-size: 0.7rem; }
            .mode-switch .mode-option { font-size: 0.5rem; padding: 2px 8px; }
            .timer-display { font-size: 0.45rem; min-width: 30px; padding: 1px 4px; }
            .timer-preset-btn { font-size: 0.45rem; padding: 2px 6px; height: 22px; min-width: 28px; }
            .status-badge { font-size: 0.4rem; padding: 1px 4px; }
            .player-info-text { font-size: 0.5rem; min-width: 30px; }
            .player-timer { font-size: 0.45rem; min-width: 40px; }
            .header { gap: 3px; padding: 3px 6px; min-height: 34px; flex-wrap: nowrap; }
            .header-btn { width: 22px; height: 22px; font-size: 0.6rem; }

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRx0WsM-o0uDBYquZ2jkvScyk_VKetZ2PQ-92qSpjx3PZIRqUyrlCP4DIDIXOcIUsXazIfJqcun7LAp/pub?gid=0&single=true&output=csv";
    const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/18-uFLokAHJVXJgRfd7nbL7GRUNHgzbdu1Nfs9fVaFqw/edit?usp=sharing";

    // ============================================================
    // STATE
    // ============================================================
    let playlists = [];
    let currentPlaylist = null;
    let currentVideoIndex = -1;
    let shuffleMode = false;
    let isPlaying = false;
    let isPlaylistView = true;
    let toastTimeout = null;
    let metadataCache = {};
    let translateCache = {};
    let translateEnabled = false;
    let isLoadingMetadata = false;
    let currentMode = 'tv';
    let history = [];
    let ytPlayer = null;
    let timerInterval = null;
    let isStopped = false;
    let isMuted = false;
    let isBusy = false;
    let autoPlayTimeout = null;
    let videoEnded = false;
    
    let timerMinutes = 0;
    let timerSeconds = 0;
    let timerCountdownInterval = null;

    // DOM refs
    const listContainer = document.getElementById('listContainer');
    const searchInput = document.getElementById('searchInput');
    const statusBadge = document.getElementById('statusBadge');
    const themeToggle = document.getElementById('themeToggle');
    const editBtn = document.getElementById('editBtn');
    const backBtn = document.getElementById('backBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const translateBtn = document.getElementById('translateBtn');
    const historyBtn = document.getElementById('historyBtn');
    const historyCloseBtn = document.getElementById('historyCloseBtn');
    const historyOverlay = document.getElementById('historyOverlay');
    const historyPanel = document.getElementById('historyPanel');
    const historyList = document.getElementById('historyList');
    const iframe = document.getElementById('playerIframe');
    const placeholder = document.getElementById('placeholder');
    const blankScreen = document.getElementById('blankScreen');
    const playerInfo = document.getElementById('playerInfo');
    const playerTimer = document.getElementById('playerTimer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playBtn = document.getElementById('playBtn');
    const muteBtn = document.getElementById('muteBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const randomBtn = document.getElementById('randomBtn');
    const randomVideoBtn = document.getElementById('randomVideoBtn');
    const tvModeOption = document.getElementById('tvModeOption');
    const radioModeOption = document.getElementById('radioModeOption');
    const timerPresetBtn = document.getElementById('timerPresetBtn');
    const timerPresetDropdown = document.getElementById('timerPresetDropdown');
    const timerDisplay = document.getElementById('timerDisplay');
    const manualInput = document.getElementById('manualInput');
    const manualPlayBtn = document.getElementById('manualPlayBtn');
    const radioVisualizer = document.getElementById('radioVisualizer');
    const radioTitle = document.getElementById('radioTitle');
    const radioSub = document.getElementById('radioSub');
    const toast = document.getElementById('toast');
    const timeDisplay = document.getElementById('timeDisplay');
    const dayDisplay = document.getElementById('dayDisplay');

    // ============================================================
    // CLOCK
    // ============================================================
    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        timeDisplay.textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        dayDisplay.textContent = days[now.getDay()];
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ============================================================
    // THEME
    // ============================================================
    let darkMode = true;
    function toggleTheme() {
        darkMode = !darkMode;
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        themeToggle.textContent = darkMode ? '🌙' : '☀️';
        localStorage.setItem('shafin-theme', darkMode ? 'dark' : 'light');
    }
    const savedTheme = localStorage.getItem('shafin-theme');
    if (savedTheme === 'light') { darkMode = false; document.documentElement.setAttribute('data-theme', 'light'); themeToggle.textContent = '☀️'; }
    themeToggle.addEventListener('click', toggleTheme);

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg, duration = 2500) {
        if (toastTimeout) clearTimeout(toastTimeout);
        toast.textContent = msg;
        toast.classList.remove('hidden');
        toastTimeout = setTimeout(() => { toast.classList.add('hidden'); }, duration);
    }

    // ============================================================
    // TIMER / FORMATTING
    // ============================================================
    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return '--:--';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updatePlayerTimer() {
        if (ytPlayer && typeof ytPlayer.getCurrentTime === 'function' && typeof ytPlayer.getDuration === 'function') {
            const current = ytPlayer.getCurrentTime();
            const duration = ytPlayer.getDuration();
            if (duration && duration > 0) {
                playerTimer.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
                // Check for video end - trigger auto-play
                if (current >= duration - 1 && isPlaying && !videoEnded && !isBusy) {
                    videoEnded = true;
                    isBusy = true;
                    if (autoPlayTimeout) clearTimeout(autoPlayTimeout);
                    autoPlayTimeout = setTimeout(() => {
                        if (currentPlaylist && !isStopped) {
                            console.log('Auto-playing next video');
                            nextVideo();
                        }
                        isBusy = false;
                        videoEnded = false;
                        autoPlayTimeout = null;
                    }, 500);
                }
            } else {
                playerTimer.textContent = '--:-- / --:--';
            }
        } else {
            playerTimer.textContent = '--:-- / --:--';
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updatePlayerTimer, 500);
        updatePlayerTimer();
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    // ============================================================
    // COUNTDOWN TIMER
    // ============================================================
    function startCountdown(minutes) {
        if (timerCountdownInterval) {
            clearInterval(timerCountdownInterval);
            timerCountdownInterval = null;
        }
        timerMinutes = minutes;
        if (minutes === 0) {
            timerDisplay.textContent = '∞';
            timerDisplay.classList.remove('active');
            timerPresetBtn.textContent = '⏱️ Inf';
            return;
        }
        timerSeconds = minutes * 60;
        timerDisplay.classList.add('active');
        updateCountdownDisplay();
        timerCountdownInterval = setInterval(() => {
            timerSeconds--;
            if (timerSeconds <= 0) {
                clearInterval(timerCountdownInterval);
                timerCountdownInterval = null;
                timerDisplay.textContent = '0:00';
                if (currentPlaylist && currentPlaylist.videoIds.length > 0 && !isBusy) {
                    isBusy = true;
                    randomVideoWithPosition();
                    showToast('⏱️ Timer: Random video at random position');
                    setTimeout(() => {
                        if (timerMinutes > 0) {
                            startCountdown(timerMinutes);
                        }
                        isBusy = false;
                    }, 1000);
                }
            } else {
                updateCountdownDisplay();
            }
        }, 1000);
    }

    function updateCountdownDisplay() {
        const mins = Math.floor(timerSeconds / 60);
        const secs = timerSeconds % 60;
        timerDisplay.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
    }

    function stopCountdown() {
        if (timerCountdownInterval) {
            clearInterval(timerCountdownInterval);
            timerCountdownInterval = null;
        }
        timerDisplay.textContent = '∞';
        timerDisplay.classList.remove('active');
        timerPresetBtn.textContent = '⏱️ Inf';
    }

    function setTimerPreset(minutes) {
        stopCountdown();
        if (minutes > 0) {
            timerPresetBtn.textContent = `⏱️ ${minutes}m`;
            timerPresetBtn.classList.add('active');
            startCountdown(minutes);
        } else {
            timerPresetBtn.textContent = '⏱️ Inf';
            timerPresetBtn.classList.remove('active');
            timerDisplay.textContent = '∞';
        }
        document.querySelectorAll('.preset-option').forEach(opt => {
            opt.classList.toggle('active', parseInt(opt.dataset.minutes) === minutes);
        });
    }

    // ============================================================
    // STOP PLAYBACK
    // ============================================================
    function stopPlayback() {
        isStopped = true;
        isBusy = false;
        videoEnded = false;
        if (autoPlayTimeout) {
            clearTimeout(autoPlayTimeout);
            autoPlayTimeout = null;
        }
        if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
            ytPlayer.pauseVideo();
        }
        if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
            ytPlayer.stopVideo();
        }
        isPlaying = false;
        playBtn.textContent = '▶';
        radioVisualizer.classList.add('paused');
        if (ytPlayer) {
            const container = document.getElementById('yt-player-container');
            if (container) container.style.display = 'none';
        }
        iframe.style.display = 'none';
        placeholder.style.display = 'none';
        radioVisualizer.classList.remove('active');
        blankScreen.classList.add('show');
        playerInfo.textContent = 'Stopped';
        playerTimer.textContent = '--:-- / --:--';
        stopTimer();
        showToast('⏹ Playback stopped');
    }

    // ============================================================
    // MUTE
    // ============================================================
    function toggleMute() {
        isMuted = !isMuted;
        if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
            ytPlayer.setVolume(isMuted ? 0 : 70);
        }
        muteBtn.textContent = isMuted ? '🔇' : '🔊';
        muteBtn.classList.toggle('muted', isMuted);
        showToast(isMuted ? '🔇 Muted' : '🔊 Unmuted');
    }

    // ============================================================
    // HISTORY
    // ============================================================
    function loadHistory() {
        try {
            const raw = localStorage.getItem('shafin_tube_history');
            if (!raw) return;
            history = JSON.parse(raw);
            if (!Array.isArray(history)) history = [];
        } catch (e) { history = []; }
    }

    function saveHistory() {
        try {
            const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            const filtered = history.filter(h => h.timestamp > sevenDaysAgo);
            localStorage.setItem('shafin_tube_history', JSON.stringify(filtered));
        } catch (e) {}
    }

    function addToHistory(playlistName, videoId, title, thumbnail, position = 0) {
        const entry = {
            playlistName,
            videoId,
            title: title || `Video`,
            thumbnail: thumbnail || `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
            timestamp: Date.now(),
            position: Math.round(position)
        };
        history = history.filter(h => !(h.videoId === videoId && h.playlistName === playlistName));
        history.unshift(entry);
        saveHistory();
        renderHistory();
    }

    function renderHistory() {
        if (history.length === 0) {
            historyList.innerHTML = '<div class="empty">No history in the last 7 days</div>';
            return;
        }
        const groups = {};
        history.forEach(h => {
            const date = new Date(h.timestamp);
            const dateKey = date.toDateString();
            if (!groups[dateKey]) groups[dateKey] = [];
            groups[dateKey].push(h);
        });
        let html = '';
        const sortedDates = Object.keys(groups).sort((a, b) => new Date(b) - new Date(a));
        sortedDates.forEach(dateKey => {
            const items = groups[dateKey];
            const dateObj = new Date(dateKey);
            const dateLabel = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            html += `<div class="history-date-group"><div class="date-label">${dateLabel}</div>`;
            items.forEach((h) => {
                const positionStr = h.position && h.position > 0 ? `${formatTime(h.position)}` : '';
                html += `
                    <div class="history-item" data-vid="${h.videoId}" data-playlist="${escapeHtml(h.playlistName)}" data-position="${h.position || 0}">
                        <img class="thumb" src="${h.thumbnail}" alt="" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${h.videoId}/mqdefault.jpg'">
                        <div class="info">
                            <div class="title">${escapeHtml(h.title)}</div>
                            <div class="sub">${escapeHtml(h.playlistName)}</div>
                        </div>
                        ${positionStr ? `<span class="position-badge">⏱ ${positionStr}</span>` : ''}
                        <span class="count-badge">${new Date(h.timestamp).toLocaleTimeString()}</span>
                    </div>
                `;
            });
            html += `</div>`;
        });
        historyList.innerHTML = html;

        historyList.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', () => {
                const videoId = el.dataset.vid;
                const playlistName = el.dataset.playlist;
                const position = parseInt(el.dataset.position) || 0;
                const playlist = playlists.find(p => p.name === playlistName);
                if (playlist) {
                    const vidIdx = playlist.videoIds.indexOf(videoId);
                    if (vidIdx >= 0) {
                        closeHistory();
                        currentPlaylist = playlist;
                        playVideo(playlist, vidIdx, false, position);
                    }
                }
            });
        });
    }

    function openHistory() {
        historyPanel.classList.add('open');
        historyOverlay.classList.add('open');
        renderHistory();
    }

    function closeHistory() {
        historyPanel.classList.remove('open');
        historyOverlay.classList.remove('open');
    }

    // ============================================================
    // TRANSLATION
    // ============================================================
    async function translateText(text) {
        if (!text || text.length < 2) return text;
        const cacheKey = text.substring(0, 100);
        if (translateCache[cacheKey]) return translateCache[cacheKey];
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('Translation failed');
            const data = await response.json();
            if (data && data[0] && data[0][0] && data[0][0][0]) {
                const translated = data[0][0][0];
                translateCache[cacheKey] = translated;
                localStorage.setItem('shafin_tube_translate_cache', JSON.stringify(translateCache));
                return translated;
            }
            return text;
        } catch (error) {
            return text;
        }
    }

    function toggleTranslation() {
        translateEnabled = !translateEnabled;
        translateBtn.classList.toggle('active', translateEnabled);
        showToast(translateEnabled ? '🌐 Translation ON' : '🌐 Translation OFF');
        if (!isPlaylistView && currentPlaylist) {
            renderVideos(currentPlaylist);
        }
    }

    // ============================================================
    // YOUTUBE PLAYER
    // ============================================================
    function loadYouTubeAPI() {
        if (typeof YT === 'undefined') {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        }
    }

    function createYouTubePlayer(videoId, autoplay = true, startPosition = 0) {
        if (typeof YT === 'undefined' || !YT.Player) {
            setTimeout(() => createYouTubePlayer(videoId, autoplay, startPosition), 500);
            return;
        }
        if (ytPlayer && typeof ytPlayer.destroy === 'function') {
            ytPlayer.destroy();
            ytPlayer = null;
        }
        isStopped = false;
        videoEnded = false;
        if (autoPlayTimeout) {
            clearTimeout(autoPlayTimeout);
            autoPlayTimeout = null;
        }
        blankScreen.classList.remove('show');
        const container = document.getElementById('videoContainer');
        const playerDiv = document.createElement('div');
        playerDiv.id = 'yt-player-container';
        playerDiv.style.width = '100%';
        playerDiv.style.height = '100%';
        playerDiv.style.position = 'relative';
        const old = document.getElementById('yt-player-container');
        if (old) old.remove();
        iframe.style.display = 'none';
        placeholder.style.display = 'none';
        container.appendChild(playerDiv);

        const playerVars = {
            rel: 0,
            modestbranding: 1,
            controls: 1,
            fs: 1,
            iv_load_policy: 3
        };
        if (autoplay) playerVars.autoplay = 1;
        if (startPosition > 0) playerVars.start = Math.floor(startPosition);

        ytPlayer = new YT.Player('yt-player-container', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: playerVars,
            events: {
                onReady: (event) => {
                    isPlaying = true;
                    playBtn.textContent = '⏸';
                    if (autoplay) event.target.playVideo();
                    startTimer();
                    if (isMuted && typeof event.target.setVolume === 'function') {
                        event.target.setVolume(0);
                    }
                    isBusy = false;
                },
                onStateChange: (event) => {
                    const state = event.data;
                    if (state === YT.PlayerState.PLAYING) {
                        isPlaying = true;
                        playBtn.textContent = '⏸';
                        radioVisualizer.classList.remove('paused');
                        videoEnded = false;
                        startTimer();
                        isBusy = false;
                    } else if (state === YT.PlayerState.PAUSED) {
                        isPlaying = false;
                        playBtn.textContent = '▶';
                        radioVisualizer.classList.add('paused');
                    } else if (state === YT.PlayerState.ENDED) {
                        isPlaying = false;
                        playBtn.textContent = '▶';
                        radioVisualizer.classList.add('paused');
                        if (!videoEnded && currentPlaylist && !isStopped) {
                            videoEnded = true;
                            isBusy = true;
                            if (autoPlayTimeout) clearTimeout(autoPlayTimeout);
                            autoPlayTimeout = setTimeout(() => {
                                if (currentPlaylist && !isStopped) {
                                    console.log('Auto-playing next video from ENDED event');
                                    nextVideo();
                                }
                                isBusy = false;
                                videoEnded = false;
                                autoPlayTimeout = null;
                            }, 500);
                        }
                    }
                },
                onError: (event) => {
                    console.warn('YouTube player error:', event.data);
                    showToast('Error playing video', true);
                    fallbackToIframe(videoId);
                }
            }
        });
    }

    function fallbackToIframe(videoId) {
        isStopped = false;
        videoEnded = false;
        blankScreen.classList.remove('show');
        iframe.style.display = (currentMode === 'tv') ? 'block' : 'none';
        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&enablejsapi=1`;
        isPlaying = true;
        playBtn.textContent = '⏸';
        startTimer();
        isBusy = false;
    }

    // ============================================================
    // CORE PLAYER FUNCTIONS
    // ============================================================
    function playVideo(playlist, videoIndex, restore = false, startPosition = 0) {
        if (isBusy) return;
        if (!playlist || videoIndex < 0 || videoIndex >= playlist.videoIds.length) return;
        
        isBusy = true;
        isStopped = false;
        videoEnded = false;
        if (autoPlayTimeout) {
            clearTimeout(autoPlayTimeout);
            autoPlayTimeout = null;
        }
        blankScreen.classList.remove('show');
        
        currentPlaylist = playlist;
        currentVideoIndex = videoIndex;
        const videoId = playlist.videoIds[videoIndex];
        if (!videoId) { isBusy = false; return; }

        const cacheKey = playlist.name;
        const cache = metadataCache[cacheKey] || {};
        const meta = cache[videoId];
        let title = meta ? meta.title : `Video ${videoIndex + 1}`;
        if (translateEnabled && meta && meta.translatedTitle) {
            title = meta.translatedTitle;
        }
        const thumb = meta ? meta.thumbnail : `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;

        if (!startPosition) {
            const historyEntry = history.find(h => h.videoId === videoId && h.playlistName === playlist.name);
            if (historyEntry && historyEntry.position > 0) {
                startPosition = historyEntry.position;
            }
        }

        addToHistory(playlist.name, videoId, title, thumb, startPosition);
        placeholder.style.display = 'none';

        if (typeof YT !== 'undefined' && YT.Player) {
            createYouTubePlayer(videoId, true, startPosition);
        } else {
            fallbackToIframe(videoId);
        }

        playerInfo.textContent = `${playlist.name} • ${title}`;
        if (!restore) showToast(`▶ ${title}`);
        saveState(playlist.name, videoIndex);
        renderVideos(playlist);

        if (currentMode === 'radio') {
            radioVisualizer.classList.add('active');
            if (isPlaying) radioVisualizer.classList.remove('paused');
            else radioVisualizer.classList.add('paused');
            radioTitle.textContent = title;
            radioSub.textContent = `${playlist.name} • Radio Mode`;
        } else {
            radioVisualizer.classList.remove('active');
        }
        
        setTimeout(() => { isBusy = false; }, 500);
    }

    function nextVideo() {
        if (isStopped) { 
            // If stopped, resume auto-play
            isStopped = false;
        }
        if (!currentPlaylist || currentPlaylist.videoIds.length === 0) {
            showToast('No playlist available', true);
            return;
        }
        if (isBusy) return;
        
        isBusy = true;
        videoEnded = false;
        if (autoPlayTimeout) {
            clearTimeout(autoPlayTimeout);
            autoPlayTimeout = null;
        }
        
        let nextIdx;
        if (shuffleMode) {
            do {
                nextIdx = Math.floor(Math.random() * currentPlaylist.videoIds.length);
            } while (nextIdx === currentVideoIndex && currentPlaylist.videoIds.length > 1);
        } else {
            nextIdx = (currentVideoIndex + 1) % currentPlaylist.videoIds.length;
        }
        playVideo(currentPlaylist, nextIdx);
        setTimeout(() => { isBusy = false; }, 500);
    }

    function prevVideo() {
        if (isStopped) { 
            isStopped = false;
        }
        if (!currentPlaylist || currentPlaylist.videoIds.length === 0) {
            showToast('No playlist available', true);
            return;
        }
        if (isBusy) return;
        
        isBusy = true;
        videoEnded = false;
        if (autoPlayTimeout) {
            clearTimeout(autoPlayTimeout);
            autoPlayTimeout = null;
        }
        
        let prevIdx;
        if (shuffleMode) {
            do {
                prevIdx = Math.floor(Math.random() * currentPlaylist.videoIds.length);
            } while (prevIdx === currentVideoIndex && currentPlaylist.videoIds.length > 1);
        } else {
            prevIdx = (currentVideoIndex - 1 + currentPlaylist.videoIds.length) % currentPlaylist.videoIds.length;
        }
        playVideo(currentPlaylist, prevIdx);
        setTimeout(() => { isBusy = false; }, 500);
    }

    function randomVideoFromStart() {
        if (!currentPlaylist || currentPlaylist.videoIds.length === 0) {
            showToast('No playlist selected', true);
            return;
        }
        if (isBusy) return;
        isStopped = false;
        videoEnded = false;
        const randomIndex = Math.floor(Math.random() * currentPlaylist.videoIds.length);
        playVideo(currentPlaylist, randomIndex);
        showToast('✨ Random video from start');
    }

    function randomVideoWithPosition() {
        if (!currentPlaylist || currentPlaylist.videoIds.length === 0) {
            showToast('No playlist selected', true);
            return;
        }
        if (isBusy) return;
        isStopped = false;
        videoEnded = false;
        const randomIndex = Math.floor(Math.random() * currentPlaylist.videoIds.length);
        playVideo(currentPlaylist, randomIndex);
        setTimeout(() => {
            if (ytPlayer && typeof ytPlayer.getDuration === 'function') {
                const duration = ytPlayer.getDuration();
                if (duration && duration > 10) {
                    const randomPos = 0.1 + Math.random() * 0.8;
                    const seekTime = duration * randomPos;
                    ytPlayer.seekTo(seekTime, true);
                    showToast(`✨ Random video at ${Math.round(randomPos * 100)}% position`);
                } else {
                    showToast('✨ Random video selected');
                }
            }
        }, 1500);
    }

    function togglePlayPause() {
        if (isStopped) {
            showToast('Playback is stopped. Select a video to play.', true);
            return;
        }
        if (ytPlayer && typeof ytPlayer.playVideo === 'function' && typeof ytPlayer.pauseVideo === 'function') {
            if (isPlaying) {
                ytPlayer.pauseVideo();
                isPlaying = false;
                playBtn.textContent = '▶';
                radioVisualizer.classList.add('paused');
                videoEnded = false;
                if (autoPlayTimeout) {
                    clearTimeout(autoPlayTimeout);
                    autoPlayTimeout = null;
                }
            } else {
                ytPlayer.playVideo();
                isPlaying = true;
                playBtn.textContent = '⏸';
                radioVisualizer.classList.remove('paused');
                videoEnded = false;
                startTimer();
            }
        }
    }

    function seekVideo(seconds) {
        if (isStopped) { showToast('Playback is stopped', true); return; }
        if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
            const currentTime = ytPlayer.getCurrentTime();
            const duration = ytPlayer.getDuration();
            const newTime = Math.max(0, Math.min(duration || 0, currentTime + seconds));
            ytPlayer.seekTo(newTime, true);
            showToast(`${seconds > 0 ? '⏩' : '⏪'} ${Math.abs(seconds)}s`);
            videoEnded = false;
        }
    }

    function toggleShuffle() {
        shuffleMode = !shuffleMode;
        shuffleBtn.classList.toggle('active', shuffleMode);
        showToast(shuffleMode ? '🔀 Shuffle ON' : '➡️ Sequential');
        saveState(currentPlaylist?.name, currentVideoIndex);
    }

    // ============================================================
    // STATE MANAGEMENT
    // ============================================================
    function saveState(playlistName, videoIndex) {
        try {
            const state = { playlistName, videoIndex, shuffleMode, currentMode, translateEnabled };
            localStorage.setItem('shafin_tube_state', JSON.stringify(state));
        } catch (e) {}
    }

    function restoreState() {
        try {
            const raw = localStorage.getItem('shafin_tube_state');
            if (!raw) return null;
            return JSON.parse(raw);
        } catch (e) { return null; }
    }

    // ============================================================
    // METADATA FETCHING
    // ============================================================
    async function fetchVideoMetadata(videoId) {
        try {
            const url = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            return {
                title: data.title || `Video ${videoId}`,
                author: data.author_name || 'Unknown',
                thumbnail: data.thumbnail_url || `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`
            };
        } catch (err) {
            return {
                title: `Video ${videoId}`,
                author: 'Unknown',
                thumbnail: `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`
            };
        }
    }

    async function fetchPlaylistMetadata(playlist, force = false) {
        if (!playlist || playlist.videoIds.length === 0) return;
        const cacheKey = playlist.name;
        if (!force && metadataCache[cacheKey] && playlist.videoIds.every(id => metadataCache[cacheKey][id])) {
            return;
        }
        if (!metadataCache[cacheKey]) metadataCache[cacheKey] = {};
        isLoadingMetadata = true;
        showToast(`Fetching metadata for ${playlist.name}...`);
        const batchSize = 5;
        let fetched = 0;
        for (let i = 0; i < playlist.videoIds.length; i += batchSize) {
            const batch = playlist.videoIds.slice(i, i + batchSize);
            const promises = batch.map(async (id) => {
                if (metadataCache[cacheKey][id]) return;
                const meta = await fetchVideoMetadata(id);
                metadataCache[cacheKey][id] = meta;
                fetched++;
                if (fetched % 5 === 0 || fetched === playlist.videoIds.length) {
                    statusBadge.textContent = `📥 ${fetched}/${playlist.videoIds.length}`;
                }
                await new Promise(r => setTimeout(r, 200));
            });
            await Promise.all(promises);
            await new Promise(r => setTimeout(r, 300));
        }
        isLoadingMetadata = false;
        statusBadge.textContent = `✅ ${playlist.videoIds.length} videos`;
        showToast(`Loaded metadata for ${playlist.videoIds.length} videos`);
        localStorage.setItem('shafin_tube_cache', JSON.stringify({ metadataCache, timestamp: Date.now() }));
        if (!isPlaylistView && currentPlaylist === playlist) {
            renderVideos(playlist);
        }
    }

    // ============================================================
    // RENDER FUNCTIONS
    // ============================================================
    function renderPlaylists() {
        isPlaylistView = true;
        backBtn.classList.remove('show');
        searchInput.placeholder = '🔍 Search playlists...';
        const search = searchInput.value.toLowerCase().trim();
        let filtered = playlists;
        if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));

        if (filtered.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding:40px 16px; font-size:0.75rem; color:var(--text2);">No playlists found</div>`;
            return;
        }

        let html = '';
        filtered.forEach((pl, idx) => {
            const isActive = currentPlaylist === pl && isPlaylistView;
            const cacheKey = pl.name;
            const cachedCount = metadataCache[cacheKey] ? Object.keys(metadataCache[cacheKey]).length : 0;
            const hasMetadata = cachedCount > 0 && cachedCount >= pl.videoIds.length;
            html += `
                <div class="list-item ${isActive ? 'active' : ''}" data-index="${idx}" data-type="playlist">
                    <span class="icon">${hasMetadata ? '📋' : '📋'}</span>
                    <div class="info">
                        <div class="title">${escapeHtml(pl.name)}</div>
                        <div class="sub">${pl.videoIds.length} videos ${hasMetadata ? '✅' : (cachedCount > 0 ? `(${cachedCount}/${pl.videoIds.length})` : '')}</div>
                    </div>
                    <span class="video-count">${pl.videoIds.length}</span>
                </div>
            `;
        });
        listContainer.innerHTML = html;

        listContainer.querySelectorAll('.list-item[data-type="playlist"]').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index);
                const pl = filtered[idx];
                if (pl) {
                    currentPlaylist = pl;
                    currentVideoIndex = -1;
                    renderVideos(pl);
                    const cacheKey = pl.name;
                    if (!metadataCache[cacheKey] || Object.keys(metadataCache[cacheKey]).length < pl.videoIds.length) {
                        fetchPlaylistMetadata(pl);
                    }
                }
            });
        });
    }

    function renderVideos(playlist) {
        isPlaylistView = false;
        backBtn.classList.add('show');
        searchInput.placeholder = '🔍 Search videos...';
        const search = searchInput.value.toLowerCase().trim();
        const cacheKey = playlist.name;
        const cache = metadataCache[cacheKey] || {};

        let html = `<div style="padding:4px 8px; font-size:0.7rem; color:var(--text2); border-bottom:1px solid var(--border); margin-bottom:4px; display:flex; justify-content:space-between; align-items:center;">
            <span>${escapeHtml(playlist.name)} (${playlist.videoIds.length})</span>
            <span style="font-size:0.6rem;">${Object.keys(cache).length}/${playlist.videoIds.length} loaded</span>
        </div>`;

        let videos = playlist.videoIds.map((id, idx) => ({ id, index: idx }));
        if (search) {
            videos = videos.filter(v => {
                const meta = cache[v.id];
                if (meta) {
                    const title = translateEnabled && meta.translatedTitle ? meta.translatedTitle : meta.title;
                    return title.toLowerCase().includes(search);
                }
                return false;
            });
        }

        if (videos.length === 0 && search) {
            html += `<div style="text-align:center; padding:20px; font-size:0.7rem; color:var(--text2);">No matching videos</div>`;
            listContainer.innerHTML = html;
            return;
        }

        videos.forEach((v) => {
            const isActive = currentVideoIndex === v.index;
            const meta = cache[v.id];
            let title = meta ? meta.title : `Video ${v.index + 1}`;
            let translated = false;
            if (translateEnabled && meta && meta.translatedTitle) {
                title = meta.translatedTitle;
                translated = true;
            }
            const thumb = meta ? meta.thumbnail : `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`;
            const author = meta ? meta.author : '';
            const translatedBadge = translated ? '<span class="translated-badge">🌐</span>' : '';

            html += `
                <div class="list-item ${isActive ? 'active' : ''}" data-video-index="${v.index}" data-type="video">
                    <img class="thumb" src="${thumb}" alt="" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${v.id}/mqdefault.jpg'">
                    <div class="info">
                        <div class="title" title="${escapeHtml(title)}">${escapeHtml(title)} ${translatedBadge}</div>
                        <div class="sub">${escapeHtml(author)} • ${v.index + 1}/${playlist.videoIds.length}</div>
                    </div>
                    <span class="badge">${v.index + 1}</span>
                </div>
            `;
        });

        if (isLoadingMetadata && Object.keys(cache).length < playlist.videoIds.length) {
            html += `<div style="text-align:center; padding:12px; font-size:0.65rem; color:var(--text2);">
                <span class="loading-spinner" style="display:inline-block; margin-right:8px;"></span> Loading metadata...
            </div>`;
        }

        listContainer.innerHTML = html;

        listContainer.querySelectorAll('.list-item[data-type="video"]').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.videoIndex);
                if (!isBusy) playVideo(playlist, idx);
            });
        });
    }

    function updateModeUI() {
        if (currentMode === 'tv') {
            tvModeOption.classList.add('active');
            radioModeOption.classList.remove('active');
            radioVisualizer.classList.remove('active');
            if (ytPlayer && !isStopped) {
                const container = document.getElementById('yt-player-container');
                if (container) container.style.display = 'block';
            }
            if (isStopped) blankScreen.classList.add('show');
            else blankScreen.classList.remove('show');
        } else {
            radioModeOption.classList.add('active');
            tvModeOption.classList.remove('active');
            radioVisualizer.classList.add('active');
            if (isPlaying) radioVisualizer.classList.remove('paused');
            else radioVisualizer.classList.add('paused');
            if (ytPlayer) {
                const container = document.getElementById('yt-player-container');
                if (container) container.style.display = 'none';
            }
            if (currentPlaylist && currentVideoIndex >= 0) {
                const cacheKey = currentPlaylist.name;
                const cache = metadataCache[cacheKey] || {};
                const videoId = currentPlaylist.videoIds[currentVideoIndex];
                const meta = cache[videoId];
                let title = meta ? meta.title : `Video ${currentVideoIndex + 1}`;
                if (translateEnabled && meta && meta.translatedTitle) title = meta.translatedTitle;
                radioTitle.textContent = title;
                radioSub.textContent = `${currentPlaylist.name} • Radio Mode`;
            }
            blankScreen.classList.remove('show');
        }
        saveState(currentPlaylist?.name, currentVideoIndex);
    }

    function setMode(mode) {
        if (mode === currentMode) return;
        currentMode = mode;
        updateModeUI();
        showToast(currentMode === 'tv' ? '📺 TV Mode' : '🎧 Radio Mode');
    }

    function goBackToPlaylists() {
        isPlaylistView = true;
        backBtn.classList.remove('show');
        searchInput.placeholder = '🔍 Search playlists...';
        searchInput.value = '';
        renderPlaylists();
    }

    function refreshMetadata() {
        if (currentPlaylist && !isPlaylistView) {
            const cacheKey = currentPlaylist.name;
            if (metadataCache[cacheKey]) delete metadataCache[cacheKey];
            fetchPlaylistMetadata(currentPlaylist, true);
            showToast('Refreshing metadata...');
        } else {
            showToast('Open a playlist first to refresh');
        }
    }

    // ============================================================
    // MANUAL INPUT
    // ============================================================
    function playManualInput() {
        const url = manualInput.value.trim();
        if (!url) { showToast('Please enter a URL', true); return; }
        if (isBusy) return;
        
        isStopped = false;
        videoEnded = false;
        blankScreen.classList.remove('show');
        
        if (url.includes('youtube.com/watch') || url.includes('youtu.be/') || url.includes('youtube.com/live')) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            if (match) {
                const videoId = match[1];
                const tempPlaylist = { name: 'Custom Video', videoIds: [videoId] };
                if (!playlists.find(p => p.name === 'Custom Video')) playlists.push(tempPlaylist);
                currentPlaylist = tempPlaylist;
                currentVideoIndex = 0;
                renderPlaylists();
                fetchPlaylistMetadata(tempPlaylist);
                setTimeout(() => playVideo(tempPlaylist, 0), 500);
                showToast(`▶ Playing: ${url}`);
                return;
            }
        }
        
        const tempPlaylist = { name: 'Custom Stream', videoIds: [url] };
        if (!playlists.find(p => p.name === 'Custom Stream')) playlists.push(tempPlaylist);
        currentPlaylist = tempPlaylist;
        currentVideoIndex = 0;
        renderPlaylists();
        
        iframe.style.display = 'block';
        iframe.src = url;
        placeholder.style.display = 'none';
        isPlaying = true;
        playBtn.textContent = '⏸';
        playerInfo.textContent = `Custom Stream`;
        showToast(`▶ Playing custom stream`);
        saveState(currentPlaylist?.name, currentVideoIndex);
    }

    // ============================================================
    // UTILITY
    // ============================================================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m] || m);
    }

    // ============================================================
    // LOAD FROM GOOGLE SHEET
    // ============================================================
    async function loadFromSheet() {
        statusBadge.textContent = '⏳ Loading...';
        try {
            const resp = await fetch(SHEET_CSV_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const csv = await resp.text();
            const rows = csv.split(/\r?\n/).filter(r => r.trim());
            if (rows.length < 2) throw new Error('No data found');

            const parsed = [];
            for (let i = 1; i < rows.length; i++) {
                const fields = [];
                let current = '', inQuotes = false;
                for (const ch of rows[i]) {
                    if (ch === '"') inQuotes = !inQuotes;
                    else if (ch === ',' && !inQuotes) { fields.push(current.trim()); current = ''; }
                    else current += ch;
                }
                fields.push(current.trim());
                const clean = s => s.replace(/^["']|["']$/g, '').trim();
                const name = clean(fields[0] || '');
                const idsRaw = clean(fields[1] || '');
                const cover = clean(fields[2] || '');
                const link = clean(fields[3] || '');
                if (name && idsRaw) {
                    const videoIds = idsRaw.split(',').map(id => id.trim()).filter(id => id.length === 11);
                    if (videoIds.length > 0) {
                        parsed.push({ name, videoIds, cover, link });
                    }
                }
            }
            if (parsed.length === 0) throw new Error('No valid playlists found');
            playlists = parsed;
            statusBadge.textContent = `✅ ${playlists.length} playlists`;
            showToast(`Loaded ${playlists.length} playlists`);
            
            try {
                const raw = localStorage.getItem('shafin_tube_cache');
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data.metadataCache) metadataCache = data.metadataCache;
                }
            } catch (e) {}
            
            try {
                const raw = localStorage.getItem('shafin_tube_translate_cache');
                if (raw) translateCache = JSON.parse(raw);
            } catch (e) {}
            
            renderPlaylists();
            
            const state = restoreState();
            if (state) {
                shuffleMode = state.shuffleMode !== undefined ? state.shuffleMode : false;
                currentMode = state.currentMode || 'tv';
                translateEnabled = state.translateEnabled || false;
                if (translateEnabled) translateBtn.classList.add('active');
                updateModeUI();
                const pl = playlists.find(p => p.name === state.playlistName);
                if (pl && state.videoIndex >= 0 && state.videoIndex < pl.videoIds.length) {
                    currentPlaylist = pl;
                    currentVideoIndex = state.videoIndex;
                    const cacheKey = pl.name;
                    if (!metadataCache[cacheKey] || Object.keys(metadataCache[cacheKey]).length < pl.videoIds.length) {
                        fetchPlaylistMetadata(pl);
                    }
                    setTimeout(() => {
                        renderVideos(pl);
                        const videoId = pl.videoIds[state.videoIndex];
                        const historyEntry = history.find(h => h.videoId === videoId && h.playlistName === pl.name);
                        const startPos = historyEntry ? historyEntry.position : 0;
                        playVideo(pl, state.videoIndex, true, startPos);
                    }, 500);
                }
            }
            loadYouTubeAPI();
        } catch (err) {
            statusBadge.textContent = '❌ Failed';
            showToast('Error: ' + err.message, 4000);
            console.error(err);
            listContainer.innerHTML = `<div style="text-align:center; padding:40px 16px; font-size:0.75rem; color:var(--text2);">❌ ${err.message}</div>`;
        }
    }

    tvModeOption.addEventListener('click', () => setMode('tv'));
    radioModeOption.addEventListener('click', () => setMode('radio'));

    timerPresetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        timerPresetDropdown.classList.toggle('open');
    });

    document.querySelectorAll('.preset-option').forEach(opt => {
        opt.addEventListener('click', (e) => {
            e.stopPropagation();
            setTimerPreset(parseInt(opt.dataset.minutes));
            timerPresetDropdown.classList.remove('open');
        });
    });

    document.addEventListener('click', () => {
        timerPresetDropdown.classList.remove('open');
    });

    manualPlayBtn.addEventListener('click', playManualInput);
    manualInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') playManualInput();
    });

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        
        if (e.key === 'ArrowLeft') { e.preventDefault(); seekVideo(-10); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); seekVideo(10); }
        else if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); togglePlayPause(); }
        else if (e.key === 'Escape') {
            if (historyPanel.classList.contains('open')) closeHistory();
            else if (!isPlaylistView) goBackToPlaylists();
        }
        else if (e.key === 's' || e.key === 'S') { toggleShuffle(); }
        else if (e.key === 'r' || e.key === 'R') { randomVideoFromStart(); }
        else if (e.key === 'm' || e.key === 'M') { toggleMute(); }
        else if (e.key === 'h' || e.key === 'H') { openHistory(); }
        else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); nextVideo(); }
        else if (e.key === 'b' || e.key === 'B') { e.preventDefault(); prevVideo(); }
        else if (e.key === 't' || e.key === 'T') { toggleTranslation(); }
        else if (e.key === 'x' || e.key === 'X') { stopPlayback(); }
        else if (e.key === 'f' || e.key === 'F') { randomVideoWithPosition(); }
    });

    // ============================================================
    // INIT
    // ============================================================
    loadHistory();
    loadFromSheet();
    setTimerPreset(0);

    console.log('🟢 Shafin Tube loaded with all features.');
    console.log('✎ Edit sheet:', SHEET_EDIT_URL);
    console.log('📺 Controls: ← → seek, Space play/pause, N next, B previous, M mute, R random (start), F random (position), S shuffle, H history, T translate, X stop');
</script>
</body>
</html>
