<script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const CONFIG = {
        SHEET_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRx0WsM-o0uDBYquZ2jkvScyk_VKetZ2PQ-92qSpjx3PZIRqUyrlCP4DIDIXOcIUsXazIfJqcun7LAp/pub?gid=0&single=true&output=csv",
        EDIT_URL: "https://docs.google.com/spreadsheets/d/18-uFLokAHJVXJgRfd7nbL7GRUNHgzbdu1Nfs9fVaFqw/edit?usp=sharing"
    };

    // ============================================================
    // DOM REFS
    // ============================================================
    const $ = (id) => document.getElementById(id);
    
    const DOM = {
        listContainer: $('listContainer'),
        searchInput: $('searchInput'),
        statusBadge: $('statusBadge'),
        themeToggle: $('themeToggle'),
        editBtn: $('editBtn'),
        backBtn: $('backBtn'),
        refreshBtn: $('refreshBtn'),
        translateBtn: $('translateBtn'),
        historyBtn: $('historyBtn'),
        historyCloseBtn: $('historyCloseBtn'),
        historyOverlay: $('historyOverlay'),
        historyPanel: $('historyPanel'),
        historyList: $('historyList'),
        iframe: $('playerIframe'),
        placeholder: $('placeholder'),
        blankScreen: $('blankScreen'),
        playerInfo: $('playerInfo'),
        playerTimer: $('playerTimer'),
        videoIdTile: $('videoIdTile'),
        prevBtn: $('prevBtn'),
        nextBtn: $('nextBtn'),
        playBtn: $('playBtn'),
        muteBtn: $('muteBtn'),
        shuffleBtn: $('shuffleBtn'),
        randomBtn: $('randomBtn'),
        groupShuffleBtn: $('groupShuffleBtn'),
        randomVideoBtn: $('randomVideoBtn'),
        tvModeOption: $('tvModeOption'),
        radioModeOption: $('radioModeOption'),
        timerPresetBtn: $('timerPresetBtn'),
        timerPresetDropdown: $('timerPresetDropdown'),
        timerDisplay: $('timerDisplay'),
        manualInput: $('manualInput'),
        manualPlayBtn: $('manualPlayBtn'),
        radioVisualizer: $('radioVisualizer'),
        radioTitle: $('radioTitle'),
        radioSub: $('radioSub'),
        toast: $('toast'),
        timeDisplay: $('timeDisplay'),
        dayDisplay: $('dayDisplay'),
        videoContainer: $('videoContainer')
    };

    // ============================================================
    // STATE
    // ============================================================
    const state = {
        groups: {},
        playlists: [],
        groupNames: [],
        playingPlaylist: null,
        playingVideoIndex: -1,
        viewingPlaylist: null,
        viewingVideoIndex: -1,
        playbackMode: 0,
        isPlaying: false,
        isPlaylistView: false,
        isGroupView: true,
        metadataCache: {},
        translateCache: {},
        translateEnabled: false,
        currentMode: 'tv',
        history: [],
        ytPlayer: null,
        isStopped: false,
        isMuted: false,
        autoPlayPending: false,
        videoEndDetected: false,
        navigationStack: ['groups'],
        currentGroupName: null,
        currentVideoId: null,
        timerSeconds: 0,
        timerInterval: null,
        timerCountdownInterval: null,
        toastTimeout: null,
        isAutoPlaying: false,
        groupShuffleEnabled: false
    };

    // ============================================================
    // UTILITY FUNCTIONS
    // ============================================================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m] || m);
    }

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return '--:--';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function parseCSVLine(line) {
        const fields = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') inQuotes = !inQuotes;
            else if (ch === ',' && !inQuotes) { fields.push(current.trim()); current = ''; }
            else current += ch;
        }
        fields.push(current.trim());
        return fields;
    }

    function showToast(msg, duration = 2500, isError = false) {
        if (!DOM.toast) return;
        if (state.toastTimeout) clearTimeout(state.toastTimeout);
        DOM.toast.textContent = msg;
        DOM.toast.style.display = 'block';
        DOM.toast.style.borderColor = isError ? 'var(--accent)' : 'var(--border)';
        state.toastTimeout = setTimeout(() => { 
            if (DOM.toast) DOM.toast.style.display = 'none'; 
        }, duration);
    }

    function updateClock() {
        if (!DOM.timeDisplay || !DOM.dayDisplay) return;
        const now = new Date();
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        DOM.timeDisplay.textContent = `${hours}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} ${ampm}`;
        DOM.dayDisplay.textContent = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][now.getDay()];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ============================================================
    // THEME
    // ============================================================
    let darkMode = true;
    function toggleTheme() {
        darkMode = !darkMode;
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        if (DOM.themeToggle) DOM.themeToggle.textContent = darkMode ? '🌙' : '☀️';
        localStorage.setItem('shafin-theme', darkMode ? 'dark' : 'light');
    }
    if (localStorage.getItem('shafin-theme') === 'light') {
        darkMode = false;
        document.documentElement.setAttribute('data-theme', 'light');
        if (DOM.themeToggle) DOM.themeToggle.textContent = '☀️';
    }
    if (DOM.themeToggle) DOM.themeToggle.addEventListener('click', toggleTheme);

    // ============================================================
    // PLAYBACK MODE
    // ============================================================
    function updateShuffleButton() {
        if (!DOM.shuffleBtn) return;
        const icons = ['➡️', '🔀', '🔁'];
        const names = ['Sequential', 'Shuffle', 'Loop'];
        DOM.shuffleBtn.textContent = icons[state.playbackMode];
        DOM.shuffleBtn.className = 'control-btn shuffle-btn';
        const classes = ['active-sequential', 'active-shuffle', 'active-loop'];
        DOM.shuffleBtn.classList.add(classes[state.playbackMode]);
        DOM.shuffleBtn.title = names[state.playbackMode] + ' Mode';
    }

    function cyclePlaybackMode() {
        state.playbackMode = (state.playbackMode + 1) % 3;
        updateShuffleButton();
        showToast(`🔄 ${['Sequential','Shuffle','Loop'][state.playbackMode]} Mode`);
        saveState();
    }

    // ============================================================
    // GROUP SHUFFLE TOGGLE
    // ============================================================
    function toggleGroupShuffle() {
        state.groupShuffleEnabled = !state.groupShuffleEnabled;
        if (DOM.groupShuffleBtn) {
            DOM.groupShuffleBtn.classList.toggle('active', state.groupShuffleEnabled);
        }
        showToast(state.groupShuffleEnabled ? '⚡ Group Shuffle ON (across playlists)' : '⚡ Group Shuffle OFF');
        saveState();
    }

    // ============================================================
    // GET RANDOM PLAYLIST FROM GROUP (Helper Function)
    // ============================================================
    function getRandomPlaylistFromGroup(groupName, excludePlaylist = null) {
        const playlistsInGroup = state.playlists.filter(p => p.group === groupName);
        if (playlistsInGroup.length === 0) return null;
        if (playlistsInGroup.length === 1) return playlistsInGroup[0];
        
        let randomPlaylist;
        let attempts = 0;
        do {
            randomPlaylist = playlistsInGroup[Math.floor(Math.random() * playlistsInGroup.length)];
            attempts++;
            // If only one playlist, break out to avoid infinite loop
            if (playlistsInGroup.length === 1) break;
        } while (randomPlaylist === excludePlaylist && attempts < 20);
        return randomPlaylist;
    }

    // ============================================================
    // TIMER
    // ============================================================
    function startPlayerTimer() {
        if (state.timerInterval) clearInterval(state.timerInterval);
        state.timerInterval = setInterval(updatePlayerTimer, 500);
    }

    function stopPlayerTimer() {
        if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }
    }

    function updatePlayerTimer() {
        if (!DOM.playerTimer) return;
        if (!state.ytPlayer || typeof state.ytPlayer.getCurrentTime !== 'function') return;
        const current = state.ytPlayer.getCurrentTime();
        const duration = state.ytPlayer.getDuration();
        if (duration && duration > 0) {
            DOM.playerTimer.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
            if (state.playingPlaylist && state.playingVideoIndex >= 0 && current > 0) {
                const videoId = state.playingPlaylist.videoIds[state.playingVideoIndex];
                updateHistoryPosition(state.playingPlaylist.name, videoId, current);
            }
            if (current >= duration - 0.5 && state.isPlaying && !state.videoEndDetected && !state.autoPlayPending && !state.isStopped) {
                state.videoEndDetected = true;
                state.autoPlayPending = true;
                setTimeout(() => {
                    if (state.playingPlaylist && !state.isStopped) handleVideoEnd();
                    state.autoPlayPending = false;
                }, 300);
            }
        }
    }

    // ============================================================
    // VIDEO END HANDLER - Supports Group Shuffle
    // ============================================================
    function handleVideoEnd() {
        const playlist = state.playingPlaylist;
        if (!playlist || playlist.videoIds.length === 0) {
            console.log('Auto-play: No playing playlist');
            return;
        }
        
        const currentIdx = state.playingVideoIndex;
        if (currentIdx < 0 || currentIdx >= playlist.videoIds.length) {
            console.log('Auto-play: Invalid video index');
            return;
        }
        
        console.log(`Auto-play: Playing from "${playlist.name}", index: ${currentIdx}`);
        console.log(`Group Shuffle: ${state.groupShuffleEnabled ? 'ON' : 'OFF'}`);
        
        let nextPlaylist = playlist;
        let nextIdx;
        
        // If group shuffle is enabled, pick a random playlist from the same group
        if (state.groupShuffleEnabled) {
            const currentGroup = playlist.group;
            const randomPlaylist = getRandomPlaylistFromGroup(currentGroup, playlist);
            if (randomPlaylist) {
                nextPlaylist = randomPlaylist;
                console.log(`Group Shuffle: Selected playlist "${randomPlaylist.name}" from group "${currentGroup}"`);
            }
        }
        
        // Determine next index within the selected playlist
        if (state.playbackMode === 2) { // Loop
            nextIdx = currentIdx;
        } else if (state.playbackMode === 1) { // Shuffle
            let idx;
            do {
                idx = Math.floor(Math.random() * nextPlaylist.videoIds.length);
            } while (idx === currentIdx && nextPlaylist.videoIds.length > 1);
            nextIdx = idx;
        } else { // Sequential
            // If we switched to a different playlist, start from the beginning
            if (nextPlaylist !== playlist) {
                nextIdx = 0;
            } else {
                nextIdx = (currentIdx + 1) % nextPlaylist.videoIds.length;
            }
        }
        
        state.isAutoPlaying = true;
        state.viewingPlaylist = nextPlaylist;
        state.viewingVideoIndex = nextIdx;
        playVideo(nextPlaylist, nextIdx);
        setTimeout(() => {
            state.isAutoPlaying = false;
        }, 500);
    }

    // ============================================================
    // YOUTUBE PLAYER
    // ============================================================
    function loadYouTubeAPI() {
        if (typeof YT === 'undefined') {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        }
    }

    function createYouTubePlayer(videoId, autoplay = true, startPosition = 0) {
        if (typeof YT === 'undefined' || !YT.Player) {
            setTimeout(() => createYouTubePlayer(videoId, autoplay, startPosition), 500);
            return;
        }
        if (state.ytPlayer && typeof state.ytPlayer.destroy === 'function') {
            state.ytPlayer.destroy();
            state.ytPlayer = null;
        }

        state.isStopped = false;
        state.videoEndDetected = false;
        state.autoPlayPending = false;
        if (DOM.blankScreen) DOM.blankScreen.classList.remove('show');
        state.currentVideoId = videoId;
        if (DOM.videoIdTile) {
            DOM.videoIdTile.textContent = 'ID: ' + videoId.substring(0, 8) + '...';
            DOM.videoIdTile.classList.add('show');
        }

        const container = DOM.videoContainer;
        const playerDiv = document.createElement('div');
        playerDiv.id = 'yt-player-container';
        playerDiv.style.cssText = 'width:100%;height:100%;position:relative;';
        const old = document.getElementById('yt-player-container');
        if (old) old.remove();
        if (DOM.iframe) DOM.iframe.style.display = 'none';
        if (DOM.placeholder) DOM.placeholder.style.display = 'none';
        container.appendChild(playerDiv);

        const playerVars = { rel: 0, modestbranding: 1, controls: 1, fs: 1, iv_load_policy: 3 };
        if (autoplay) playerVars.autoplay = 1;
        if (startPosition > 0) playerVars.start = Math.floor(startPosition);

        state.ytPlayer = new YT.Player('yt-player-container', {
            height: '100%', width: '100%', videoId: videoId, playerVars: playerVars,
            events: {
                onReady: (e) => {
                    state.isPlaying = true;
                    if (DOM.playBtn) DOM.playBtn.textContent = '⏸';
                    if (autoplay) e.target.playVideo();
                    startPlayerTimer();
                    if (state.isMuted && typeof e.target.setVolume === 'function') e.target.setVolume(0);
                },
                onStateChange: (e) => {
                    const s = e.data;
                    if (s === YT.PlayerState.PLAYING) {
                        state.isPlaying = true;
                        if (DOM.playBtn) DOM.playBtn.textContent = '⏸';
                        if (DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused');
                        state.videoEndDetected = false;
                        startPlayerTimer();
                    } else if (s === YT.PlayerState.PAUSED) {
                        state.isPlaying = false;
                        if (DOM.playBtn) DOM.playBtn.textContent = '▶';
                        if (DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused');
                    } else if (s === YT.PlayerState.ENDED) {
                        state.isPlaying = false;
                        if (DOM.playBtn) DOM.playBtn.textContent = '▶';
                        if (DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused');
                        if (!state.videoEndDetected && state.playingPlaylist && !state.isStopped && !state.autoPlayPending) {
                            state.videoEndDetected = true;
                            state.autoPlayPending = true;
                            setTimeout(() => {
                                if (state.playingPlaylist && !state.isStopped) handleVideoEnd();
                                state.autoPlayPending = false;
                            }, 300);
                        }
                    }
                },
                onError: () => showToast('Error playing video', 3000, true)
            }
        });
    }

    function fallbackToIframe(videoId) {
        state.isStopped = false;
        state.videoEndDetected = false;
        if (DOM.blankScreen) DOM.blankScreen.classList.remove('show');
        state.currentVideoId = videoId;
        if (DOM.videoIdTile) {
            DOM.videoIdTile.textContent = 'ID: ' + videoId.substring(0, 8) + '...';
            DOM.videoIdTile.classList.add('show');
        }
        if (DOM.iframe) {
            DOM.iframe.style.display = (state.currentMode === 'tv') ? 'block' : 'none';
            DOM.iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&enablejsapi=1`;
        }
        state.isPlaying = true;
        if (DOM.playBtn) DOM.playBtn.textContent = '⏸';
        startPlayerTimer();
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function navigateToGroups() {
        state.isGroupView = true;
        state.isPlaylistView = false;
        if (DOM.backBtn) DOM.backBtn.classList.remove('show');
        if (DOM.searchInput) {
            DOM.searchInput.placeholder = '🔍 Search groups...';
            DOM.searchInput.value = '';
        }
        state.currentGroupName = null;
        state.navigationStack = ['groups'];
        renderGroups();
    }

    function navigateToGroup(groupName) {
        state.isGroupView = false;
        state.isPlaylistView = false;
        if (DOM.backBtn) DOM.backBtn.classList.add('show');
        if (DOM.searchInput) {
            DOM.searchInput.placeholder = '🔍 Search playlists...';
            DOM.searchInput.value = '';
        }
        state.currentGroupName = groupName;
        if (state.navigationStack[state.navigationStack.length - 1] !== 'group:' + groupName) {
            state.navigationStack.push('group:' + groupName);
        }
        renderGroupPlaylists(groupName);
    }

    function navigateToPlaylist(playlist) {
        state.isGroupView = false;
        state.isPlaylistView = true;
        if (DOM.backBtn) DOM.backBtn.classList.add('show');
        if (DOM.searchInput) {
            DOM.searchInput.placeholder = '🔍 Search videos...';
            DOM.searchInput.value = '';
        }
        state.viewingPlaylist = playlist;
        state.viewingVideoIndex = state.playingVideoIndex;
        if (state.navigationStack[state.navigationStack.length - 1] !== 'playlist:' + playlist.name) {
            state.navigationStack.push('playlist:' + playlist.name);
        }
        renderVideos(playlist);
    }

    function goBack() {
        if (state.navigationStack.length <= 1) { navigateToGroups(); return; }
        state.navigationStack.pop();
        const last = state.navigationStack[state.navigationStack.length - 1];
        if (last === 'groups') navigateToGroups();
        else if (last.startsWith('group:')) {
            const groupName = last.replace('group:', '');
            state.isGroupView = false;
            state.isPlaylistView = false;
            if (DOM.backBtn) DOM.backBtn.classList.add('show');
            if (DOM.searchInput) DOM.searchInput.placeholder = '🔍 Search playlists...';
            state.currentGroupName = groupName;
            renderGroupPlaylists(groupName);
        } else if (last.startsWith('playlist:')) {
            const playlistName = last.replace('playlist:', '');
            const playlist = state.playlists.find(p => p.name === playlistName);
            if (playlist) {
                state.isGroupView = false;
                state.isPlaylistView = true;
                if (DOM.backBtn) DOM.backBtn.classList.add('show');
                if (DOM.searchInput) DOM.searchInput.placeholder = '🔍 Search videos...';
                state.viewingPlaylist = playlist;
                renderVideos(playlist);
            } else navigateToGroups();
        } else navigateToGroups();
    }

    // ============================================================
    // RENDER FUNCTIONS - Added Duration Display
    // ============================================================
    function renderGroups() {
        if (!DOM.listContainer) return;
        const search = DOM.searchInput ? DOM.searchInput.value.toLowerCase().trim() : '';
        let filtered = state.groupNames;
        if (search) filtered = state.groupNames.filter(g => g.toLowerCase().includes(search));

        if (filtered.length === 0) {
            DOM.listContainer.innerHTML = `<div style="text-align:center;padding:40px 16px;font-size:0.75rem;color:var(--text2);">No groups found</div>`;
            return;
        }

        let html = '';
        filtered.forEach(groupName => {
            const pls = state.groups[groupName] || [];
            const totalVideos = pls.reduce((sum, p) => sum + p.videoIds.length, 0);
            const icon = groupName.toLowerCase().includes('quran') ? '📖' :
                         groupName.toLowerCase().includes('music') ? '🎵' :
                         groupName.toLowerCase().includes('movie') ? '🎬' :
                         groupName.toLowerCase().includes('islam') ? '🕌' : '📁';
            html += `
                <div class="list-item" data-group="${escapeHtml(groupName)}" data-type="group">
                    <span class="group-icon">${icon}</span>
                    <div class="info">
                        <div class="title">${escapeHtml(groupName)}</div>
                        <div class="sub">${pls.length} playlists • ${totalVideos} videos</div>
                    </div>
                    <span class="badge">${pls.length}</span>
                </div>
            `;
        });
        DOM.listContainer.innerHTML = html;

        DOM.listContainer.querySelectorAll('.list-item[data-type="group"]').forEach(el => {
            el.addEventListener('click', () => navigateToGroup(el.dataset.group));
        });
    }

    function renderGroupPlaylists(groupName) {
        if (!DOM.listContainer) return;
        const playlistsInGroup = state.groups[groupName] || [];
        const search = DOM.searchInput ? DOM.searchInput.value.toLowerCase().trim() : '';
        let filtered = playlistsInGroup;
        if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));

        if (filtered.length === 0) {
            DOM.listContainer.innerHTML = `<div style="text-align:center;padding:40px 16px;font-size:0.75rem;color:var(--text2);">No playlists in this group</div>`;
            return;
        }

        let html = `<div style="padding:4px 8px;font-size:0.7rem;color:var(--text2);border-bottom:1px solid var(--border);margin-bottom:4px;">
            📂 ${escapeHtml(groupName)} (${filtered.length} playlists)
        </div>`;

        filtered.forEach((pl, idx) => {
            const isActive = state.viewingPlaylist === pl && state.isPlaylistView;
            const cacheKey = pl.name;
            const cachedCount = state.metadataCache[cacheKey] ? Object.keys(state.metadataCache[cacheKey]).length : 0;
            const hasMetadata = cachedCount > 0 && cachedCount >= pl.videoIds.length;
            html += `
                <div class="list-item ${isActive ? 'active' : ''}" data-index="${idx}" data-type="playlist">
                    <span class="icon">${hasMetadata ? '📋' : '📋'}</span>
                    <div class="info">
                        <div class="title">${escapeHtml(pl.name)}</div>
                        <div class="sub">${pl.videoIds.length} videos ${hasMetadata ? '✅' : (cachedCount > 0 ? `(${cachedCount}/${pl.videoIds.length})` : '')}</div>
                    </div>
                    <span class="video-count">${pl.videoIds.length}</span>
                </div>
            `;
        });
        DOM.listContainer.innerHTML = html;

        DOM.listContainer.querySelectorAll('.list-item[data-type="playlist"]').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index);
                const pl = filtered[idx];
                if (pl) {
                    navigateToPlaylist(pl);
                    const cacheKey = pl.name;
                    if (!state.metadataCache[cacheKey] || Object.keys(state.metadataCache[cacheKey]).length < pl.videoIds.length) {
                        fetchPlaylistMetadata(pl);
                    }
                }
            });
        });
    }

    function renderVideos(playlist) {
        if (!DOM.listContainer) return;
        const search = DOM.searchInput ? DOM.searchInput.value.toLowerCase().trim() : '';
        const cacheKey = playlist.name;
        const cache = state.metadataCache[cacheKey] || {};

        let html = `<div style="padding:4px 8px;font-size:0.7rem;color:var(--text2);border-bottom:1px solid var(--border);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;">
            <span>▶ ${escapeHtml(playlist.name)} (${playlist.videoIds.length})</span>
            <span style="font-size:0.6rem;">${Object.keys(cache).length}/${playlist.videoIds.length} loaded</span>
        </div>`;

        let videos = playlist.videoIds.map((id, idx) => ({ id, index: idx }));
        if (search) {
            videos = videos.filter(v => {
                const meta = cache[v.id];
                if (meta) {
                    const title = state.translateEnabled && meta.translatedTitle ? meta.translatedTitle : meta.title;
                    return title.toLowerCase().includes(search);
                }
                return false;
            });
        }

        if (videos.length === 0 && search) {
            html += `<div style="text-align:center;padding:20px;font-size:0.7rem;color:var(--text2);">No matching videos</div>`;
            DOM.listContainer.innerHTML = html;
            return;
        }

        videos.forEach((v) => {
            const isActive = state.viewingPlaylist === playlist && state.viewingVideoIndex === v.index;
            const meta = cache[v.id];
            let title = meta ? meta.title : `Video ${v.index + 1}`;
            let translated = false;
            if (state.translateEnabled && meta && meta.translatedTitle) {
                title = meta.translatedTitle;
                translated = true;
            }
            const thumb = meta ? meta.thumbnail : `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`;
            const author = meta ? meta.author : '';
            const duration = meta ? (meta.duration ? formatTime(meta.duration) : '') : '';
            const translatedBadge = translated ? '<span class="translated-badge">🌐</span>' : '';

            html += `
                <div class="list-item ${isActive ? 'active' : ''}" data-video-index="${v.index}" data-type="video">
                    <img class="thumb" src="${thumb}" alt="" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${v.id}/mqdefault.jpg'">
                    <div class="info">
                        <div class="title" title="${escapeHtml(title)}">${escapeHtml(title)} ${translatedBadge}</div>
                        <div class="sub">${escapeHtml(author)} ${duration ? `<span class="duration">• ${duration}</span>` : ''}</div>
                    </div>
                    <span class="badge">${v.index + 1}</span>
                </div>
            `;
        });

        if (state.isLoadingMetadata && Object.keys(cache).length < playlist.videoIds.length) {
            html += `<div style="text-align:center;padding:12px;font-size:0.65rem;color:var(--text2);">
                <span class="loading-spinner" style="display:inline-block;margin-right:8px;"></span> Loading metadata...
            </div>`;
        }

        DOM.listContainer.innerHTML = html;

        DOM.listContainer.querySelectorAll('.list-item[data-type="video"]').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.videoIndex);
                state.playingPlaylist = playlist;
                state.playingVideoIndex = idx;
                state.viewingPlaylist = playlist;
                state.viewingVideoIndex = idx;
                playVideo(playlist, idx);
            });
        });
    }

    // ============================================================
    // HISTORY POSITION UPDATE
    // ============================================================
    function updateHistoryPosition(playlistName, videoId, position) {
        const entry = state.history.find(h => h.videoId === videoId && h.playlistName === playlistName);
        if (entry) {
            entry.position = Math.round(position);
            saveHistory();
        }
    }

    // ============================================================
    // CORE PLAYER FUNCTIONS - FIXED: Group Shuffle works globally
    // ============================================================
    function playVideo(playlist, videoIndex, restore = false, startPosition = 0) {
        if (!playlist || videoIndex < 0 || videoIndex >= playlist.videoIds.length) {
            console.log('playVideo: Invalid playlist or index');
            return;
        }
        
        state.playingPlaylist = playlist;
        state.playingVideoIndex = videoIndex;
        state.viewingPlaylist = playlist;
        state.viewingVideoIndex = videoIndex;
        
        state.videoEndDetected = false;
        state.autoPlayPending = false;
        state.isStopped = false;
        if (DOM.blankScreen) DOM.blankScreen.classList.remove('show');
        
        const videoId = playlist.videoIds[videoIndex];
        if (!videoId) return;

        const cacheKey = playlist.name;
        const cache = state.metadataCache[cacheKey] || {};
        const meta = cache[videoId];
        let title = meta ? meta.title : `Video ${videoIndex + 1}`;
        if (state.translateEnabled && meta && meta.translatedTitle) title = meta.translatedTitle;
        const thumb = meta ? meta.thumbnail : `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;

        if (!startPosition) {
            const historyEntry = state.history.find(h => h.videoId === videoId && h.playlistName === playlist.name);
            if (historyEntry && historyEntry.position > 0) {
                startPosition = historyEntry.position;
                console.log(`Resuming video at position: ${formatTime(startPosition)}`);
            }
        }

        addToHistory(playlist.name, videoId, title, thumb, startPosition);
        if (DOM.placeholder) DOM.placeholder.style.display = 'none';

        if (typeof YT !== 'undefined' && YT.Player) {
            createYouTubePlayer(videoId, true, startPosition);
        } else {
            fallbackToIframe(videoId);
        }

        if (DOM.playerInfo) DOM.playerInfo.textContent = `${playlist.name} • ${title}`;
        if (!restore) showToast(`▶ ${title}`);
        saveState();
        
        if (state.isPlaylistView && state.viewingPlaylist) {
            renderVideos(state.viewingPlaylist);
        }

        if (state.currentMode === 'radio') {
            if (DOM.radioVisualizer) DOM.radioVisualizer.classList.add('active');
            if (state.isPlaying) {
                if (DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused');
            } else {
                if (DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused');
            }
            if (DOM.radioTitle) DOM.radioTitle.textContent = title;
            if (DOM.radioSub) DOM.radioSub.textContent = `${playlist.name} • Radio Mode`;
        } else {
            if (DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('active');
        }
    }

    // FIXED: Next Video - Group Shuffle works here too
    function nextVideo() {
        if (!state.playingPlaylist || state.playingPlaylist.videoIds.length === 0) {
            showToast('No playlist playing', 2000, true);
            return;
        }
        state.videoEndDetected = false;
        state.autoPlayPending = false;
        state.isStopped = false;
        
        let playlist = state.playingPlaylist;
        let idx;
        
        // If group shuffle is enabled, pick a random playlist from the same group
        if (state.groupShuffleEnabled) {
            const currentGroup = playlist.group;
            const randomPlaylist = getRandomPlaylistFromGroup(currentGroup, playlist);
            if (randomPlaylist && randomPlaylist !== playlist) {
                playlist = randomPlaylist;
                console.log(`Group Shuffle (Next): Selected playlist "${randomPlaylist.name}" from group "${currentGroup}"`);
            }
        }
        
        // Determine next index within the selected playlist
        if (state.playbackMode === 1) { // Shuffle
            do {
                idx = Math.floor(Math.random() * playlist.videoIds.length);
            } while (idx === state.playingVideoIndex && playlist.videoIds.length > 1);
        } else {
            // If we switched to a different playlist, start from the beginning
            if (playlist !== state.playingPlaylist) {
                idx = 0;
            } else {
                idx = (state.playingVideoIndex + 1) % playlist.videoIds.length;
            }
        }
        playVideo(playlist, idx);
    }

    // FIXED: Previous Video - Group Shuffle works here too
    function prevVideo() {
        if (!state.playingPlaylist || state.playingPlaylist.videoIds.length === 0) {
            showToast('No playlist playing', 2000, true);
            return;
        }
        state.videoEndDetected = false;
        state.autoPlayPending = false;
        state.isStopped = false;
        
        let playlist = state.playingPlaylist;
        let idx;
        
        // If group shuffle is enabled, pick a random playlist from the same group
        if (state.groupShuffleEnabled) {
            const currentGroup = playlist.group;
            const randomPlaylist = getRandomPlaylistFromGroup(currentGroup, playlist);
            if (randomPlaylist && randomPlaylist !== playlist) {
                playlist = randomPlaylist;
                console.log(`Group Shuffle (Prev): Selected playlist "${randomPlaylist.name}" from group "${currentGroup}"`);
            }
        }
        
        // Determine previous index within the selected playlist
        if (state.playbackMode === 1) { // Shuffle
            do {
                idx = Math.floor(Math.random() * playlist.videoIds.length);
            } while (idx === state.playingVideoIndex && playlist.videoIds.length > 1);
        } else {
            // If we switched to a different playlist, go to the end
            if (playlist !== state.playingPlaylist) {
                idx = playlist.videoIds.length - 1;
            } else {
                idx = (state.playingVideoIndex - 1 + playlist.videoIds.length) % playlist.videoIds.length;
            }
        }
        playVideo(playlist, idx);
    }

    function randomVideoFromStart() {
        if (!state.playingPlaylist || state.playingPlaylist.videoIds.length === 0) {
            showToast('No playlist selected', 2000, true);
            return;
        }
        state.isStopped = false;
        state.videoEndDetected = false;
        state.autoPlayPending = false;
        const playlist = state.playingPlaylist;
        const idx = Math.floor(Math.random() * playlist.videoIds.length);
        playVideo(playlist, idx);
        showToast('✨ Random video from start');
    }

    function randomVideoWithPosition() {
        if (!state.playingPlaylist || state.playingPlaylist.videoIds.length === 0) {
            showToast('No playlist selected', 2000, true);
            return;
        }
        state.isStopped = false;
        state.videoEndDetected = false;
        state.autoPlayPending = false;
        const playlist = state.playingPlaylist;
        const idx = Math.floor(Math.random() * playlist.videoIds.length);
        playVideo(playlist, idx);
        setTimeout(() => {
            if (state.ytPlayer && typeof state.ytPlayer.getDuration === 'function') {
                const duration = state.ytPlayer.getDuration();
                if (duration && duration > 10) {
                    const pos = 0.1 + Math.random() * 0.8;
                    state.ytPlayer.seekTo(duration * pos, true);
                    showToast(`✨ Random video at ${Math.round(pos * 100)}% position`);
                    const videoId = playlist.videoIds[idx];
                    updateHistoryPosition(playlist.name, videoId, duration * pos);
                }
            }
        }, 1500);
    }

    function togglePlayPause() {
        if (state.isStopped) {
            showToast('Playback is stopped. Select a video to play.', 2000, true);
            return;
        }
        if (state.ytPlayer && typeof state.ytPlayer.playVideo === 'function') {
            if (state.isPlaying) {
                state.ytPlayer.pauseVideo();
                state.isPlaying = false;
                if (DOM.playBtn) DOM.playBtn.textContent = '▶';
                if (DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused');
                if (state.playingPlaylist && state.playingVideoIndex >= 0) {
                    const videoId = state.playingPlaylist.videoIds[state.playingVideoIndex];
                    const pos = state.ytPlayer.getCurrentTime();
                    updateHistoryPosition(state.playingPlaylist.name, videoId, pos);
                }
            } else {
                state.ytPlayer.playVideo();
                state.isPlaying = true;
                if (DOM.playBtn) DOM.playBtn.textContent = '⏸';
                if (DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused');
                state.videoEndDetected = false;
                startPlayerTimer();
            }
        }
    }

    function seekVideo(seconds) {
        if (state.isStopped) { showToast('Playback is stopped', 1500, true); return; }
        if (state.ytPlayer && typeof state.ytPlayer.seekTo === 'function') {
            const current = state.ytPlayer.getCurrentTime();
            const duration = state.ytPlayer.getDuration();
            const newTime = Math.max(0, Math.min(duration || 0, current + seconds));
            state.ytPlayer.seekTo(newTime, true);
            showToast(`${seconds > 0 ? '⏩' : '⏪'} ${Math.abs(seconds)}s`);
            state.videoEndDetected = false;
            if (state.playingPlaylist && state.playingVideoIndex >= 0) {
                const videoId = state.playingPlaylist.videoIds[state.playingVideoIndex];
                updateHistoryPosition(state.playingPlaylist.name, videoId, newTime);
            }
        }
    }

    function stopPlayback() {
        state.isStopped = true;
        state.videoEndDetected = false;
        state.autoPlayPending = false;
        if (state.ytPlayer && typeof state.ytPlayer.pauseVideo === 'function') {
            state.ytPlayer.pauseVideo();
            state.ytPlayer.stopVideo();
        }
        state.isPlaying = false;
        if (DOM.playBtn) DOM.playBtn.textContent = '▶';
        if (DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused');
        if (state.ytPlayer) {
            const container = document.getElementById('yt-player-container');
            if (container) container.style.display = 'none';
        }
        if (DOM.iframe) DOM.iframe.style.display = 'none';
        if (DOM.placeholder) DOM.placeholder.style.display = 'none';
        if (DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('active');
        if (DOM.blankScreen) DOM.blankScreen.classList.add('show');
        if (DOM.playerInfo) DOM.playerInfo.textContent = 'Stopped';
        if (DOM.playerTimer) DOM.playerTimer.textContent = '--:-- / --:--';
        if (DOM.videoIdTile) {
            DOM.videoIdTile.classList.remove('show');
            DOM.videoIdTile.textContent = 'ID: ---';
        }
        state.currentVideoId = null;
        stopPlayerTimer();
        showToast('⏹ Playback stopped');
    }

    function toggleMute() {
        state.isMuted = !state.isMuted;
        if (state.ytPlayer && typeof state.ytPlayer.setVolume === 'function') {
            state.ytPlayer.setVolume(state.isMuted ? 0 : 70);
        }
        if (DOM.muteBtn) {
            DOM.muteBtn.textContent = state.isMuted ? '🔇' : '🔊';
            DOM.muteBtn.classList.toggle('muted', state.isMuted);
        }
        showToast(state.isMuted ? '🔇 Muted' : '🔊 Unmuted');
    }

    // ============================================================
    // HISTORY
    // ============================================================
    function loadHistory() {
        try {
            const raw = localStorage.getItem('shafin_tube_history');
            if (raw) state.history = JSON.parse(raw);
            if (!Array.isArray(state.history)) state.history = [];
        } catch (e) { state.history = []; }
    }

    function saveHistory() {
        try {
            const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            state.history = state.history.filter(h => h.timestamp > sevenDaysAgo);
            localStorage.setItem('shafin_tube_history', JSON.stringify(state.history));
        } catch (e) {}
    }

    function addToHistory(playlistName, videoId, title, thumbnail, position = 0) {
        state.history = state.history.filter(h => !(h.videoId === videoId && h.playlistName === playlistName));
        const entry = { 
            playlistName, 
            videoId, 
            title, 
            thumbnail, 
            timestamp: Date.now(), 
            position: Math.round(position) 
        };
        state.history.unshift(entry);
        saveHistory();
        renderHistory();
    }

    function renderHistory() {
        if (!DOM.historyList) return;
        if (state.history.length === 0) {
            DOM.historyList.innerHTML = '<div class="empty">No history in the last 7 days</div>';
            return;
        }
        const groups = {};
        state.history.forEach(h => {
            const dateKey = new Date(h.timestamp).toDateString();
            if (!groups[dateKey]) groups[dateKey] = [];
            groups[dateKey].push(h);
        });
        let html = '';
        Object.keys(groups).sort((a, b) => new Date(b) - new Date(a)).forEach(dateKey => {
            const items = groups[dateKey];
            const dateObj = new Date(dateKey);
            html += `<div class="history-date-group"><div class="date-label">${dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}</div>`;
            items.forEach((h) => {
                const posStr = h.position && h.position > 0 ? `${formatTime(h.position)}` : '';
                html += `
                    <div class="history-item" data-vid="${h.videoId}" data-playlist="${escapeHtml(h.playlistName)}" data-position="${h.position || 0}">
                        <img class="thumb" src="${h.thumbnail}" alt="" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${h.videoId}/mqdefault.jpg'">
                        <div class="info">
                            <div class="title">${escapeHtml(h.title)}</div>
                            <div class="sub">${escapeHtml(h.playlistName)}</div>
                        </div>
                        ${posStr ? `<span class="position-badge">⏱ ${posStr}</span>` : ''}
                        <span class="count-badge">${new Date(h.timestamp).toLocaleTimeString()}</span>
                    </div>
                `;
            });
            html += `</div>`;
        });
        DOM.historyList.innerHTML = html;

        DOM.historyList.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', () => {
                const videoId = el.dataset.vid;
                const playlistName = el.dataset.playlist;
                const position = parseInt(el.dataset.position) || 0;
                const playlist = state.playlists.find(p => p.name === playlistName);
                if (playlist) {
                    const vidIdx = playlist.videoIds.indexOf(videoId);
                    if (vidIdx >= 0) {
                        closeHistory();
                        state.playingPlaylist = playlist;
                        state.playingVideoIndex = vidIdx;
                        state.viewingPlaylist = playlist;
                        state.viewingVideoIndex = vidIdx;
                        navigateToPlaylist(playlist);
                        playVideo(playlist, vidIdx, false, position);
                    }
                }
            });
        });
    }

    function openHistory() {
        if (DOM.historyPanel) DOM.historyPanel.classList.add('open');
        if (DOM.historyOverlay) DOM.historyOverlay.classList.add('open');
        renderHistory();
    }

    function closeHistory() {
        if (DOM.historyPanel) DOM.historyPanel.classList.remove('open');
        if (DOM.historyOverlay) DOM.historyOverlay.classList.remove('open');
    }

    // ============================================================
    // TRANSLATION
    // ============================================================
    async function translateText(text) {
        if (!text || text.length < 2) return text;
        const cacheKey = text.substring(0, 100);
        if (state.translateCache[cacheKey]) return state.translateCache[cacheKey];
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('Translation failed');
            const data = await response.json();
            if (data && data[0] && data[0][0] && data[0][0][0]) {
                const translated = data[0][0][0];
                state.translateCache[cacheKey] = translated;
                localStorage.setItem('shafin_tube_translate', JSON.stringify(state.translateCache));
                return translated;
            }
            return text;
        } catch (error) { return text; }
    }

    function toggleTranslation() {
        state.translateEnabled = !state.translateEnabled;
        if (DOM.translateBtn) DOM.translateBtn.classList.toggle('active', state.translateEnabled);
        showToast(state.translateEnabled ? '🌐 Translation ON' : '🌐 Translation OFF');
        if (state.isPlaylistView && state.viewingPlaylist) renderVideos(state.viewingPlaylist);
    }

    // ============================================================
    // METADATA FETCHING - Added duration
    // ============================================================
    async function fetchVideoMetadata(videoId) {
        try {
            const url = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`;
            const resp = await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            return { 
                title: data.title || `Video ${videoId}`, 
                author: data.author_name || 'Unknown', 
                thumbnail: data.thumbnail_url || `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
                duration: data.duration || 0
            };
        } catch (err) {
            return { 
                title: `Video ${videoId}`, 
                author: 'Unknown', 
                thumbnail: `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
                duration: 0
            };
        }
    }

    async function fetchPlaylistMetadata(playlist, force = false) {
        if (!playlist || playlist.videoIds.length === 0) return;
        const cacheKey = playlist.name;
        
        if (!force && state.metadataCache[cacheKey]) {
            const allCached = playlist.videoIds.every(id => state.metadataCache[cacheKey][id]);
            if (allCached) return;
        }
        
        if (!state.metadataCache[cacheKey]) state.metadataCache[cacheKey] = {};
        state.isLoadingMetadata = true;
        showToast(`Fetching metadata for ${playlist.name}...`);
        
        const batchSize = 5;
        let fetched = 0;
        const total = playlist.videoIds.length;
        
        for (let i = 0; i < total; i += batchSize) {
            const batch = playlist.videoIds.slice(i, i + batchSize);
            const promises = batch.map(async (id) => {
                if (state.metadataCache[cacheKey][id]) return;
                const meta = await fetchVideoMetadata(id);
                state.metadataCache[cacheKey][id] = meta;
                fetched++;
                if (fetched % 5 === 0 || fetched === total) {
                    if (DOM.statusBadge) DOM.statusBadge.textContent = `📥 ${fetched}/${total}`;
                }
                await new Promise(r => setTimeout(r, 200));
            });
            await Promise.all(promises);
            await new Promise(r => setTimeout(r, 300));
        }
        
        state.isLoadingMetadata = false;
        if (DOM.statusBadge) DOM.statusBadge.textContent = `✅ ${total} videos`;
        showToast(`Loaded metadata for ${total} videos`);
        localStorage.setItem('shafin_tube_cache', JSON.stringify({ metadataCache: state.metadataCache, timestamp: Date.now() }));
        if (state.isPlaylistView && state.viewingPlaylist === playlist) renderVideos(playlist);
    }

    // ============================================================
    // STATE MANAGEMENT
    // ============================================================
    function saveState() {
        try {
            const stateData = {
                playlistName: state.playingPlaylist?.name || null,
                videoIndex: state.playingVideoIndex,
                playbackMode: state.playbackMode,
                currentMode: state.currentMode,
                translateEnabled: state.translateEnabled,
                groupShuffleEnabled: state.groupShuffleEnabled
            };
            localStorage.setItem('shafin_tube_state', JSON.stringify(stateData));
        } catch (e) {}
    }

    function restoreState() {
        try {
            const raw = localStorage.getItem('shafin_tube_state');
            if (!raw) return null;
            return JSON.parse(raw);
        } catch (e) { return null; }
    }

    // ============================================================
    // MODE UI
    // ============================================================
    function updateModeUI() {
        if (state.currentMode === 'tv') {
            if (DOM.tvModeOption) DOM.tvModeOption.classList.add('active');
            if (DOM.radioModeOption) DOM.radioModeOption.classList.remove('active');
            if (DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('active');
            if (state.ytPlayer && !state.isStopped) {
                const container = document.getElementById('yt-player-container');
                if (container) container.style.display = 'block';
            }
            if (state.isStopped) {
                if (DOM.blankScreen) DOM.blankScreen.classList.add('show');
            } else {
                if (DOM.blankScreen) DOM.blankScreen.classList.remove('show');
            }
        } else {
            if (DOM.radioModeOption) DOM.radioModeOption.classList.add('active');
            if (DOM.tvModeOption) DOM.tvModeOption.classList.remove('active');
            if (DOM.radioVisualizer) DOM.radioVisualizer.classList.add('active');
            if (state.isPlaying) {
                if (DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused');
            } else {
                if (DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused');
            }
            if (state.ytPlayer) {
                const container = document.getElementById('yt-player-container');
                if (container) container.style.display = 'none';
            }
            if (state.playingPlaylist && state.playingVideoIndex >= 0) {
                const cacheKey = state.playingPlaylist.name;
                const cache = state.metadataCache[cacheKey] || {};
                const videoId = state.playingPlaylist.videoIds[state.playingVideoIndex];
                const meta = cache[videoId];
                let title = meta ? meta.title : `Video ${state.playingVideoIndex + 1}`;
                if (state.translateEnabled && meta && meta.translatedTitle) title = meta.translatedTitle;
                if (DOM.radioTitle) DOM.radioTitle.textContent = title;
                if (DOM.radioSub) DOM.radioSub.textContent = `${state.playingPlaylist.name} • Radio Mode`;
            }
            if (DOM.blankScreen) DOM.blankScreen.classList.remove('show');
        }
        saveState();
    }

    function setMode(mode) {
        if (mode === state.currentMode) return;
        state.currentMode = mode;
        updateModeUI();
        showToast(state.currentMode === 'tv' ? '📺 TV Mode' : '🎧 Radio Mode');
    }

    // ============================================================
    // COUNTDOWN TIMER
    // ============================================================
    function setTimerPreset(minutes) {
        if (state.timerCountdownInterval) {
            clearInterval(state.timerCountdownInterval);
            state.timerCountdownInterval = null;
        }
        if (minutes === 0) {
            if (DOM.timerDisplay) {
                DOM.timerDisplay.textContent = '∞';
                DOM.timerDisplay.classList.remove('active');
            }
            if (DOM.timerPresetBtn) DOM.timerPresetBtn.textContent = '⏱️ Inf';
            return;
        }
        state.timerSeconds = minutes * 60;
        if (DOM.timerDisplay) {
            DOM.timerDisplay.classList.add('active');
            DOM.timerDisplay.textContent = `${minutes}:00`;
        }
        if (DOM.timerPresetBtn) {
            DOM.timerPresetBtn.textContent = `⏱️ ${minutes}m`;
            DOM.timerPresetBtn.classList.add('active');
        }
        state.timerCountdownInterval = setInterval(() => {
            state.timerSeconds--;
            if (state.timerSeconds <= 0) {
                clearInterval(state.timerCountdownInterval);
                state.timerCountdownInterval = null;
                if (DOM.timerDisplay) DOM.timerDisplay.textContent = '0:00';
                if (state.playingPlaylist && state.playingPlaylist.videoIds.length > 0 && !state.autoPlayPending) {
                    state.autoPlayPending = true;
                    randomVideoWithPosition();
                    showToast('⏱️ Timer: Random video at random position');
                    setTimeout(() => {
                        if (state.timerMinutes > 0) setTimerPreset(state.timerMinutes);
                        state.autoPlayPending = false;
                    }, 1000);
                }
            } else {
                const mins = Math.floor(state.timerSeconds / 60);
                const secs = state.timerSeconds % 60;
                if (DOM.timerDisplay) DOM.timerDisplay.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
            }
        }, 1000);
    }

    // ============================================================
    // COPY VIDEO ID
    // ============================================================
    function copyVideoId() {
        if (!state.currentVideoId) { showToast('No video playing', 1500, true); return; }
        navigator.clipboard.writeText(state.currentVideoId).then(() => {
            showToast('📋 Video ID copied: ' + state.currentVideoId);
            if (DOM.videoIdTile) DOM.videoIdTile.style.borderColor = 'var(--accent)';
            setTimeout(() => {
                if (DOM.videoIdTile) DOM.videoIdTile.style.borderColor = 'var(--border)';
            }, 1500);
        }).catch(() => {
            const textArea = document.createElement('textarea');
            textArea.value = state.currentVideoId;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            showToast('📋 Video ID copied: ' + state.currentVideoId);
        });
    }

    // ============================================================
    // LOAD FROM GOOGLE SHEET
    // ============================================================
    async function loadFromSheet() {
        if (DOM.statusBadge) DOM.statusBadge.textContent = '⏳ Loading...';
        if (DOM.listContainer) {
            DOM.listContainer.innerHTML = `<div style="text-align:center;padding:40px 16px;font-size:0.75rem;color:var(--text2);">
                <span class="loading-spinner" style="display:inline-block;margin-right:8px;"></span> Loading groups...
            </div>`;
        }
        
        try {
            console.log('📡 Fetching CSV...');
            const resp = await fetch(CONFIG.SHEET_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            
            const csv = await resp.text();
            console.log('📄 CSV loaded, length:', csv.length);
            
            const rows = csv.split(/\r?\n/).filter(r => r.trim());
            console.log('📊 Found', rows.length, 'rows');
            
            if (rows.length < 2) throw new Error('CSV has no data rows');
            
            state.groups = {};
            state.playlists = [];
            state.groupNames = [];
            let validPlaylists = 0;
            
            for (let i = 1; i < rows.length; i++) {
                const fields = parseCSVLine(rows[i]);
                if (fields.length < 2) continue;
                
                const name = fields[0]?.trim() || '';
                const idsRaw = fields[1]?.trim() || '';
                const group = fields[2]?.trim() || 'Uncategorized';
                const link = fields[3]?.trim() || '';
                
                if (!name || !idsRaw) continue;
                
                const videoIds = idsRaw.split(',').map(id => id.trim()).filter(id => id.length === 11);
                if (videoIds.length === 0) {
                    console.warn(`⚠️ No valid video IDs for: "${name}"`);
                    continue;
                }
                
                const playlist = { name, videoIds, group, link };
                state.playlists.push(playlist);
                validPlaylists++;
                
                if (!state.groups[group]) state.groups[group] = [];
                state.groups[group].push(playlist);
            }
            
            state.groupNames = Object.keys(state.groups).sort();
            
            console.log(`✅ Loaded ${validPlaylists} playlists in ${state.groupNames.length} groups`);
            
            if (validPlaylists === 0) {
                throw new Error('No valid playlists found. Check your CSV format.');
            }
            
            if (DOM.statusBadge) DOM.statusBadge.textContent = `✅ ${validPlaylists} playlists`;
            showToast(`Loaded ${validPlaylists} playlists in ${state.groupNames.length} groups`);
            
            try {
                const raw = localStorage.getItem('shafin_tube_cache');
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data.metadataCache) state.metadataCache = data.metadataCache;
                }
            } catch (e) {}
            
            navigateToGroups();
            
            const savedState = restoreState();
            if (savedState) {
                state.playbackMode = savedState.playbackMode !== undefined ? savedState.playbackMode : 0;
                state.currentMode = savedState.currentMode || 'tv';
                state.translateEnabled = savedState.translateEnabled || false;
                state.groupShuffleEnabled = savedState.groupShuffleEnabled || false;
                if (state.groupShuffleEnabled && DOM.groupShuffleBtn) {
                    DOM.groupShuffleBtn.classList.add('active');
                }
                if (state.translateEnabled && DOM.translateBtn) DOM.translateBtn.classList.add('active');
                updateShuffleButton();
                updateModeUI();
            }
            
            state.isPlaying = false;
            state.isStopped = true;
            if (DOM.blankScreen) DOM.blankScreen.classList.add('show');
            if (DOM.playerInfo) DOM.playerInfo.textContent = 'No video playing';
            if (DOM.playerTimer) DOM.playerTimer.textContent = '--:-- / --:--';
            if (DOM.videoIdTile) {
                DOM.videoIdTile.classList.remove('show');
                DOM.videoIdTile.textContent = 'ID: ---';
            }
            state.currentVideoId = null;
            
            loadYouTubeAPI();
            
        } catch (err) {
            if (DOM.statusBadge) DOM.statusBadge.textContent = '❌ Failed';
            showToast('Error: ' + err.message, 4000, true);
            console.error('❌ Load error:', err);
            if (DOM.listContainer) {
                DOM.listContainer.innerHTML = `<div style="text-align:center;padding:40px 16px;font-size:0.75rem;color:var(--text2);">
                    ❌ ${err.message}<br>
                    <span style="font-size:0.6rem;margin-top:8px;display:block;">Check console (F12) for details</span>
                    <button onclick="location.reload()" style="margin-top:12px;padding:6px 16px;background:var(--accent);color:#fff;border:none;border-radius:20px;cursor:pointer;">Retry</button>
                </div>`;
            }
        }
    }

    // ============================================================
    // MANUAL INPUT
    // ============================================================
    function extractVideoId(url) {
        if (!url) return null;
        const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
        const match = url.match(regex);
        return match ? match[1] : null;
    }

    function playManualInput() {
        if (!DOM.manualInput) return;
        const url = DOM.manualInput.value.trim();
        if (!url) { showToast('Please enter a URL', 2000, true); return; }
        
        state.isStopped = false;
        state.videoEndDetected = false;
        state.autoPlayPending = false;
        if (DOM.blankScreen) DOM.blankScreen.classList.remove('show');
        
        const videoId = extractVideoId(url);
        if (videoId) {
            const tempPlaylist = { name: 'Custom Video', videoIds: [videoId] };
            if (!state.playlists.find(p => p.name === 'Custom Video')) {
                state.playlists.push(tempPlaylist);
                if (!state.groups['Custom']) state.groups['Custom'] = [];
                if (!state.groups['Custom'].find(p => p.name === 'Custom Video')) {
                    state.groups['Custom'].push(tempPlaylist);
                }
                if (!state.groupNames.includes('Custom')) state.groupNames.push('Custom');
            }
            state.playingPlaylist = tempPlaylist;
            state.playingVideoIndex = 0;
            state.viewingPlaylist = tempPlaylist;
            state.viewingVideoIndex = 0;
            navigateToPlaylist(tempPlaylist);
            fetchPlaylistMetadata(tempPlaylist);
            setTimeout(() => playVideo(tempPlaylist, 0), 500);
            showToast(`▶ Playing: ${url}`);
            return;
        }
        
        const tempPlaylist = { name: 'Custom Stream', videoIds: [url] };
        if (!state.playlists.find(p => p.name === 'Custom Stream')) {
            state.playlists.push(tempPlaylist);
            if (!state.groups['Custom']) state.groups['Custom'] = [];
            if (!state.groups['Custom'].find(p => p.name === 'Custom Stream')) {
                state.groups['Custom'].push(tempPlaylist);
            }
            if (!state.groupNames.includes('Custom')) state.groupNames.push('Custom');
        }
        state.playingPlaylist = tempPlaylist;
        state.playingVideoIndex = 0;
        state.viewingPlaylist = tempPlaylist;
        state.viewingVideoIndex = 0;
        navigateToPlaylist(tempPlaylist);
        if (DOM.iframe) {
            DOM.iframe.style.display = 'block';
            DOM.iframe.src = url;
        }
        if (DOM.placeholder) DOM.placeholder.style.display = 'none';
        state.isPlaying = true;
        if (DOM.playBtn) DOM.playBtn.textContent = '⏸';
        if (DOM.playerInfo) DOM.playerInfo.textContent = `Custom Stream`;
        showToast(`▶ Playing custom stream`);
        saveState();
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================
    function init() {
        console.log('🔄 Initializing Shafin Tube...');
        
        loadHistory();
        console.log('✅ History loaded');
        
        updateShuffleButton();
        updateModeUI();
        setTimerPreset(0);
        console.log('✅ UI updated');
        
        console.log('📡 Loading from sheet...');
        loadFromSheet();
        
        if (DOM.searchInput) {
            DOM.searchInput.addEventListener('input', () => {
                if (state.isGroupView) renderGroups();
                else if (state.currentGroupName && !state.isPlaylistView) renderGroupPlaylists(state.currentGroupName);
                else if (state.isPlaylistView && state.viewingPlaylist) renderVideos(state.viewingPlaylist);
            });
        }

        if (DOM.backBtn) DOM.backBtn.addEventListener('click', goBack);
        if (DOM.refreshBtn) {
            DOM.refreshBtn.addEventListener('click', () => {
                if (state.viewingPlaylist && state.isPlaylistView) {
                    const cacheKey = state.viewingPlaylist.name;
                    if (state.metadataCache[cacheKey]) delete state.metadataCache[cacheKey];
                    fetchPlaylistMetadata(state.viewingPlaylist, true);
                    showToast('Refreshing metadata...');
                } else {
                    showToast('Open a playlist first to refresh', 1500, true);
                }
            });
        }
        
        if (DOM.translateBtn) DOM.translateBtn.addEventListener('click', toggleTranslation);
        if (DOM.groupShuffleBtn) DOM.groupShuffleBtn.addEventListener('click', toggleGroupShuffle);
        if (DOM.historyBtn) DOM.historyBtn.addEventListener('click', openHistory);
        if (DOM.historyCloseBtn) DOM.historyCloseBtn.addEventListener('click', closeHistory);
        if (DOM.historyOverlay) DOM.historyOverlay.addEventListener('click', closeHistory);
        if (DOM.randomBtn) DOM.randomBtn.addEventListener('click', randomVideoWithPosition);
        if (DOM.randomVideoBtn) DOM.randomVideoBtn.addEventListener('click', randomVideoFromStart);
        if (DOM.muteBtn) DOM.muteBtn.addEventListener('click', toggleMute);

        if (DOM.prevBtn) DOM.prevBtn.addEventListener('click', prevVideo);
        if (DOM.nextBtn) DOM.nextBtn.addEventListener('click', nextVideo);
        if (DOM.playBtn) DOM.playBtn.addEventListener('click', togglePlayPause);
        if (DOM.shuffleBtn) DOM.shuffleBtn.addEventListener('click', cyclePlaybackMode);

        if (DOM.tvModeOption) DOM.tvModeOption.addEventListener('click', () => setMode('tv'));
        if (DOM.radioModeOption) DOM.radioModeOption.addEventListener('click', () => setMode('radio'));

        if (DOM.timerPresetBtn) {
            DOM.timerPresetBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (DOM.timerPresetDropdown) DOM.timerPresetDropdown.classList.toggle('open');
            });
        }

        document.querySelectorAll('.preset-option').forEach(opt => {
            opt.addEventListener('click', (e) => {
                e.stopPropagation();
                setTimerPreset(parseInt(opt.dataset.minutes));
                if (DOM.timerPresetDropdown) DOM.timerPresetDropdown.classList.remove('open');
            });
        });

        document.addEventListener('click', () => {
            if (DOM.timerPresetDropdown) DOM.timerPresetDropdown.classList.remove('open');
        });

        if (DOM.manualPlayBtn) DOM.manualPlayBtn.addEventListener('click', playManualInput);
        if (DOM.manualInput) {
            DOM.manualInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') playManualInput();
            });
        }

        if (DOM.videoIdTile) DOM.videoIdTile.addEventListener('click', copyVideoId);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !state.isPlaying && state.playingPlaylist && !state.autoPlayPending && !state.isStopped) {
                if (state.ytPlayer && typeof state.ytPlayer.getCurrentTime === 'function') {
                    const current = state.ytPlayer.getCurrentTime();
                    const duration = state.ytPlayer.getDuration();
                    if (duration > 0 && current >= duration - 0.5) {
                        state.videoEndDetected = true;
                        state.autoPlayPending = true;
                        setTimeout(() => {
                            if (state.playingPlaylist && !state.isStopped) handleVideoEnd();
                            state.autoPlayPending = false;
                        }, 300);
                    }
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            
            if (e.key === 'ArrowLeft') { e.preventDefault(); seekVideo(-10); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); seekVideo(10); }
            else if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); togglePlayPause(); }
            else if (e.key === 'Escape') {
                if (DOM.historyPanel && DOM.historyPanel.classList.contains('open')) closeHistory();
                else if (!state.isGroupView) goBack();
            }
            else if (e.key === 's' || e.key === 'S') { cyclePlaybackMode(); }
            else if (e.key === 'r' || e.key === 'R') { randomVideoFromStart(); }
            else if (e.key === 'm' || e.key === 'M') { toggleMute(); }
            else if (e.key === 'h' || e.key === 'H') { openHistory(); }
            else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); nextVideo(); }
            else if (e.key === 'b' || e.key === 'B') { e.preventDefault(); prevVideo(); }
            else if (e.key === 't' || e.key === 'T') { toggleTranslation(); }
            else if (e.key === 'x' || e.key === 'X') { stopPlayback(); }
            else if (e.key === 'f' || e.key === 'F') { randomVideoWithPosition(); }
            else if (e.key === 'c' || e.key === 'C') { copyVideoId(); }
            else if (e.key === 'g' || e.key === 'G') { toggleGroupShuffle(); }
        });

        console.log('🟢 Shafin Tube initialized successfully!');
        console.log('✎ Edit sheet:', CONFIG.EDIT_URL);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
