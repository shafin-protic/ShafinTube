<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Shafin Tube</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000000'/><rect x='15' y='25' width='70' height='50' rx='8' fill='%231a1a1a' stroke='%232a2a2a' stroke-width='2'/><rect x='35' y='38' width='30' height='24' rx='4' fill='%23ff0000'/><circle cx='50' cy='50' r='6' fill='%23ffffff'/></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0a0a0a; --bg2: #111111; --bg3: #1a1a1a; --bg4: #222222;
            --text: #f0f0f0; --text2: #999999; --border: #1a1a1a;
            --accent: #ff0000; --accent2: #cc0000;
            --radius: 8px; --transition: 0.15s ease;
            --mobile-nav-h: 60px;
        }
        [data-theme="light"] {
            --bg: #f0f0f0; --bg2: #e8e8e8; --bg3: #dddddd; --bg4: #cccccc;
            --text: #111111; --text2: #555555; --border: #cccccc;
            --accent: #e60000; --accent2: #b30000;
        }
        html, body { height: 100%; overflow: hidden; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; transition: background var(--transition), color var(--transition); }
        .app { display: flex; flex-direction: column; height: 100vh; max-width: 100vw; overflow: hidden; }
        
        .header { background: var(--bg2); padding: 4px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; min-height: 38px; gap: 4px; }
        .logo-area { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .logo-img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: var(--bg3); flex-shrink: 0; }
        .logo-text { font-size: 0.8rem; font-weight: 700; color: var(--text); }
        .logo-text span { color: var(--accent); }
        
        .header-center { display: flex; align-items: center; gap: 4px; flex: 1; justify-content: center; overflow: hidden; }
        .manual-input-wrap { display: flex; align-items: center; gap: 3px; background: var(--bg3); border: 1px solid var(--border); border-radius: 16px; padding: 1px 3px 1px 10px; max-width: 200px; min-width: 80px; }
        .manual-input-wrap input { background: transparent; border: none; color: var(--text); font-size: 0.5rem; outline: none; padding: 3px 0; width: 100%; min-width: 40px; }
        .manual-input-wrap input::placeholder { color: var(--text2); }
        .manual-input-wrap .play-btn { background: var(--accent); border: none; color: #fff; padding: 1px 8px; border-radius: 12px; cursor: pointer; font-size: 0.45rem; font-weight: 600; white-space: nowrap; }
        
        .header-right { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
        .header-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 0.6rem; display: flex; align-items: center; justify-content: center; transition: all var(--transition); flex-shrink: 0; }
        .header-btn:hover { background: var(--bg4); transform: scale(1.05); }
        .header-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .header-btn.category-btn { font-size: 0.5rem; padding: 0 8px; border-radius: 12px; width: auto; height: 22px; background: var(--bg3); border-color: var(--border); color: var(--text2); }
        .header-btn.category-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .header-btn.category-btn .seg-icon { margin-right: 2px; }
        
        .status-badge { font-size: 0.4rem; color: var(--text2); background: var(--bg3); padding: 1px 6px; border-radius: 12px; border: 1px solid var(--border); white-space: nowrap; flex-shrink: 0; }
        .clock-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; min-width: 68px; width: 68px; min-height: 22px; flex-shrink: 0; line-height: 1.1; }
        .clock-tile .time { font-size: 0.55rem; font-weight: 600; color: var(--text); letter-spacing: 0.2px; white-space: nowrap; }
        .clock-tile .day { font-size: 0.3rem; color: var(--text2); text-transform: uppercase; }
        
        .main-content { display: flex; flex: 1; overflow: hidden; min-height: 0; }
        .sidebar { width: 320px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        .sidebar-header { padding: 3px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 4px; align-items: center; }
        .sidebar-header .home-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sidebar-header .home-btn:hover { background: var(--bg4); }
        .sidebar-search { flex: 1; min-width: 60px; padding: 2px 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-size: 0.55rem; outline: none; }
        .sidebar-search:focus { border-color: var(--accent); }
        .sidebar-search::placeholder { color: var(--text2); }
        .back-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 2px 8px; border-radius: 14px; cursor: pointer; font-size: 0.5rem; display: none; align-items: center; gap: 2px; flex-shrink: 0; }
        .back-btn.show { display: flex; }
        
        .list-container { flex: 1; overflow-y: auto; padding: 3px 5px; -webkit-overflow-scrolling: touch; }
        .list-container::-webkit-scrollbar { width: 3px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
        .list-item { display: flex; align-items: center; gap: 6px; padding: 4px 6px; margin: 1px 0; border-radius: var(--radius); cursor: pointer; transition: all 0.1s; border-left: 2px solid transparent; }
        .list-item:hover { background: var(--hover); }
        .list-item.active { background: var(--bg3); border-left-color: var(--accent); }
        .list-item .thumb { width: 28px; height: 16px; border-radius: 3px; background: var(--bg3); flex-shrink: 0; object-fit: cover; }
        .list-item .info { flex: 1; min-width: 0; }
        .list-item .title { font-size: 0.6rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); display: flex; align-items: center; gap: 3px; }
        .list-item .sub { font-size: 0.45rem; color: var(--text2); margin-top: 1px; }
        .list-item .badge { font-size: 0.4rem; background: var(--bg4); padding: 1px 5px; border-radius: 8px; color: var(--text2); flex-shrink: 0; margin-left: auto; }
        .list-item .group-icon { font-size: 0.9rem; flex-shrink: 0; width: 22px; text-align: center; }
        .list-item .translated-badge { font-size: 0.4rem; background: var(--accent); color: #fff; padding: 0 4px; border-radius: 8px; flex-shrink: 0; }
        
        .player-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; overflow: hidden; }
        .video-container { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
        .video-container iframe { width: 100%; height: 100%; border: none; display: none; }
        .video-container iframe.active { display: block; }
        .video-container video { width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }
        .video-container video.active { display: block; }
        .video-container .placeholder { color: var(--text2); font-size: 0.7rem; text-align: center; padding: 20px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .video-container .placeholder .big-icon { font-size: 1.8rem; display: block; margin-bottom: 4px; }
        .video-container .blank { display: none; width: 100%; height: 100%; background: #000; }
        .video-container .blank.show { display: block; }
        
        .radio-visualizer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0a0a, #1a0a0a); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 20px; z-index: 5; }
        .radio-visualizer.active { display: flex; }
        .radio-visualizer .radio-icon { font-size: 2.5rem; animation: pulse 2s infinite; }
        .radio-visualizer .radio-title { font-size: 0.85rem; font-weight: 500; color: var(--text); text-align: center; max-width: 80%; }
        .radio-visualizer .radio-sub { font-size: 0.55rem; color: var(--text2); text-align: center; }
        .radio-visualizer .equalizer { display: flex; gap: 2px; height: 25px; }
        .radio-visualizer .equalizer-bar { width: 3px; background: var(--accent); border-radius: 2px; animation: equalize 1s infinite ease-in-out; }
        .radio-visualizer .equalizer-bar:nth-child(1) { animation-delay: 0s; height: 8px; }
        .radio-visualizer .equalizer-bar:nth-child(2) { animation-delay: 0.15s; height: 16px; }
        .radio-visualizer .equalizer-bar:nth-child(3) { animation-delay: 0.3s; height: 5px; }
        .radio-visualizer .equalizer-bar:nth-child(4) { animation-delay: 0.45s; height: 20px; }
        .radio-visualizer .equalizer-bar:nth-child(5) { animation-delay: 0.6s; height: 10px; }
        .radio-visualizer .equalizer-bar:nth-child(6) { animation-delay: 0.75s; height: 6px; }
        .radio-visualizer.paused .equalizer-bar { animation-play-state: paused !important; }
        .radio-visualizer.paused .radio-icon { animation-play-state: paused !important; }
        @keyframes equalize { 0%,100%{height:6px}50%{height:20px} }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1} }
        
        .progress-container { width: 100%; height: 2px; background: var(--bg3); cursor: pointer; flex-shrink: 0; }
        .progress-container .progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s ease; }
        .progress-container:hover { height: 4px; }
        
        .controls { background: var(--bg2); padding: 4px 8px; display: flex; align-items: center; justify-content: center; gap: 4px; border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
        .control-btn { width: 26px; height: 26px; border-radius: 50%; font-size: 0.65rem; background: var(--bg3); border: 1px solid var(--border); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition); flex-shrink: 0; }
        .control-btn:hover { background: var(--bg4); transform: scale(1.05); }
        .control-btn:active { transform: scale(0.94); }
        .control-btn.shuffle-btn { font-size: 0.6rem; min-width: 26px; }
        .control-btn.shuffle-btn.active-shuffle { background: var(--accent); border-color: var(--accent); color: #fff; }
        .control-btn.shuffle-btn.active-loop { background: var(--accent); border-color: var(--accent); color: #fff; }
        .control-btn.mute-btn.muted { background: var(--accent); border-color: var(--accent); color: #fff; }
        
        .mode-switch { display: flex; gap: 1px; background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 1px; flex-shrink: 0; }
        .mode-switch .mode-option { padding: 2px 8px; border-radius: 12px; font-size: 0.45rem; font-weight: 500; cursor: pointer; transition: all var(--transition); color: var(--text2); background: transparent; border: none; }
        .mode-switch .mode-option.active { background: var(--accent); color: #fff; }
        
        .player-info-text { font-size: 0.45rem; color: var(--text2); flex: 1; min-width: 30px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-timer { font-size: 0.4rem; color: var(--text2); font-variant-numeric: tabular-nums; min-width: 45px; text-align: right; flex-shrink: 0; }
        .video-id-tile { font-size: 0.4rem; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; min-width: 35px; text-align: center; font-family: monospace; flex-shrink: 0; display: none; cursor: pointer; }
        .video-id-tile.show { display: block; }
        
        .toast { position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%); background: var(--bg3); color: var(--text); padding: 3px 10px; border-radius: 16px; font-size: 0.5rem; border: 1px solid var(--border); z-index: 2000; animation: toastIn 0.3s ease; max-width: 90%; text-align: center; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .toast.hidden { display: none; }
        
        .bottom-nav { display: flex; background: var(--bg2); border-top: 1px solid var(--border); padding: 2px 8px; gap: 2px; flex-shrink: 0; justify-content: space-around; }
        .bottom-nav .nav-btn { background: transparent; border: none; color: var(--text2); padding: 4px 8px; border-radius: 8px; font-size: 0.55rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; transition: all var(--transition); }
        .bottom-nav .nav-btn .nav-icon { font-size: 0.9rem; }
        .bottom-nav .nav-btn:hover { background: var(--bg3); color: var(--text); }
        .bottom-nav .nav-btn.active { color: var(--accent); background: var(--accent); color: #fff; }
        .bottom-nav .nav-btn.bottom-go-to { color: var(--text2); }
        .bottom-nav .nav-btn.bottom-go-to:hover { background: var(--bg3); }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; border-right: 0; border-top: 1px solid var(--border); }
            .main-content { flex-direction: column; overflow-y: auto; }
            .player-area { order: 1; flex: 0 0 auto; }
            .sidebar { order: 2; max-height: 45vh; }
            .video-container { aspect-ratio: 16/9; width: 100%; height: auto !important; }
            .header-center { display: none; }
            .header-right .status-badge,
            .header-right .clock-tile { display: none; }
            .header-right .category-btn { display: flex; }
            .bottom-nav .nav-btn { font-size: 0.5rem; padding: 3px 6px; }
            .bottom-nav .nav-btn .nav-icon { font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .header { padding: 2px 6px; min-height: 32px; }
            .logo-text { font-size: 0.7rem; }
            .logo-img { width: 18px; height: 18px; }
            .header-btn { width: 20px; height: 20px; font-size: 0.5rem; }
            .header-btn.category-btn { font-size: 0.45rem; padding: 0 6px; height: 18px; }
            .manual-input-wrap { max-width: 120px; min-width: 60px; }
            .manual-input-wrap input { font-size: 0.4rem; }
            .manual-input-wrap .play-btn { font-size: 0.4rem; padding: 1px 6px; }
            .sidebar-header { padding: 2px 4px; }
            .sidebar-search { font-size: 0.5rem; padding: 2px 6px; min-width: 40px; }
            .list-item { padding: 3px 4px; gap: 4px; }
            .list-item .thumb { width: 24px; height: 14px; }
            .list-item .title { font-size: 0.55rem; }
            .list-item .sub { font-size: 0.4rem; }
            .controls { gap: 3px; padding: 2px 4px; }
            .control-btn { width: 22px; height: 22px; font-size: 0.55rem; }
            .mode-switch .mode-option { font-size: 0.4rem; padding: 1px 5px; }
            .clock-tile { min-width: 55px; width: 55px; min-height: 18px; }
            .clock-tile .time { font-size: 0.45rem; }
            .clock-tile .day { font-size: 0.25rem; }
            .bottom-nav .nav-btn { font-size: 0.4rem; padding: 2px 4px; }
            .bottom-nav .nav-btn .nav-icon { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="logo-area">
            <img class="logo-img" src="https://i.postimg.cc/yYbyhL4w/Rounded-Profile.png" alt="Shafin Tube" onerror="this.style.display='none'">
            <div class="logo-text">Shafin<span>Tube</span></div>
        </div>
        <div class="header-center">
            <div class="manual-input-wrap">
                <input type="text" id="manualInput" placeholder="URL..." />
                <button class="play-btn" id="manualPlayBtn">▶</button>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn category-btn active" data-category="playlists"><span class="seg-icon">📋</span>Playlists</button>
            <button class="header-btn category-btn" data-category="subscriptions"><span class="seg-icon">📺</span>Subs</button>
            <button class="header-btn category-btn" data-category="iptv"><span class="seg-icon">📡</span>IPTV</button>
            <span class="status-badge" id="statusBadge">Ready</span>
            <button class="header-btn" id="themeToggle" title="Theme">🌙</button>
            <div class="clock-tile" id="clockDisplay">
                <span class="time" id="timeDisplay">--:--</span>
                <span class="day" id="dayDisplay">---</span>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="home-btn" id="homeBtn" title="Home">🏠</button>
                <input class="sidebar-search" id="searchInput" type="text" placeholder="Search...">
                <button class="back-btn" id="backBtn">⬅</button>
            </div>
            <div class="list-container" id="listContainer">
                <div style="text-align:center;padding:30px 16px;font-size:0.6rem;color:var(--text2);">Loading...</div>
            </div>
        </div>

        <div class="player-area">
            <div class="video-container" id="videoContainer">
                <div class="blank" id="blankScreen"></div>
                <div class="radio-visualizer" id="radioVisualizer">
                    <div class="radio-icon">🎧</div>
                    <div class="radio-title" id="radioTitle">Select content</div>
                    <div class="radio-sub" id="radioSub">Radio Mode</div>
                    <div class="equalizer"><div class="equalizer-bar"></div><div class="equalizer-bar"></div><div class="equalizer-bar"></div><div class="equalizer-bar"></div><div class="equalizer-bar"></div><div class="equalizer-bar"></div></div>
                </div>
                <div class="placeholder" id="placeholder">
                    <span class="big-icon">🎬</span>
                    <p>Select content to start</p>
                </div>
                <iframe id="playerIframe" src="" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
                <video id="nativeVideo" playsinline controls></video>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="controls">
                <button class="control-btn" id="prevBtn" title="Previous">⏮</button>
                <button class="control-btn" id="playBtn" title="Play/Pause">⏸</button>
                <button class="control-btn" id="nextBtn" title="Next">⏭</button>
                <button class="control-btn shuffle-btn" id="shuffleBtn" title="Mode">➡️</button>
                <button class="control-btn mute-btn" id="muteBtn" title="Mute">🔊</button>
                <div class="mode-switch">
                    <button class="mode-option active" data-mode="tv" id="tvModeOption">📺</button>
                    <button class="mode-option" data-mode="radio" id="radioModeOption">🎧</button>
                </div>
                <span class="player-info-text" id="playerInfo">No content</span>
                <span class="player-timer" id="playerTimer">--:--</span>
                <span class="video-id-tile" id="videoIdTile">ID</span>
            </div>
        </div>
    </div>

    <div class="bottom-nav" id="bottomNav">
        <button class="nav-btn active" id="navHome"><span class="nav-icon">🏠</span><span>Home</span></button>
        <button class="nav-btn" id="navHistory"><span class="nav-icon">📜</span><span>History</span></button>
        <button class="nav-btn bottom-go-to" id="navGoTo"><span class="nav-icon">↪</span><span>Go to</span></button>
        <button class="nav-btn" id="navRandom"><span class="nav-icon">✨</span><span>Random</span></button>
        <button class="nav-btn" id="navTranslate"><span class="nav-icon">🌐</span><span>Translate</span></button>
    </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// ============================================================
// SHAFIN TUBE v6 - MINIMAL & FAST
// ============================================================

const CONFIG = {
    PLAYLIST: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRx0WsM-o0uDBYquZ2jkvScyk_VKetZ2PQ-92qSpjx3PZIRqUyrlCP4DIDIXOcIUsXazIfJqcun7LAp/pub?gid=0&single=true&output=csv",
    SUBSCRIPTIONS: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRx0WsM-o0uDBYquZ2jkvScyk_VKetZ2PQ-92qSpjx3PZIRqUyrlCP4DIDIXOcIUsXazIfJqcun7LAp/pub?gid=2012650406&single=true&output=csv",
    IPTV: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRx0WsM-o0uDBYquZ2jkvScyk_VKetZ2PQ-92qSpjx3PZIRqUyrlCP4DIDIXOcIUsXazIfJqcun7LAp/pub?gid=1815432154&single=true&output=csv"
};

const $ = id => document.getElementById(id);
const DOM = {
    list: $('listContainer'), search: $('searchInput'), status: $('statusBadge'),
    home: $('homeBtn'), back: $('backBtn'), iframe: $('playerIframe'),
    nativeVideo: $('nativeVideo'), placeholder: $('placeholder'),
    blank: $('blankScreen'), playerInfo: $('playerInfo'),
    playerTimer: $('playerTimer'), videoIdTile: $('videoIdTile'),
    prev: $('prevBtn'), next: $('nextBtn'), play: $('playBtn'),
    mute: $('muteBtn'), shuffle: $('shuffleBtn'),
    tvMode: $('tvModeOption'), radioMode: $('radioModeOption'),
    manualInput: $('manualInput'), manualPlay: $('manualPlayBtn'),
    toast: $('toast'), timeDisplay: $('timeDisplay'), dayDisplay: $('dayDisplay'),
    progressBar: $('progressBar'), progressContainer: $('progressContainer'),
    radioVisualizer: $('radioVisualizer'), radioTitle: $('radioTitle'),
    radioSub: $('radioSub'), videoContainer: $('videoContainer'),
    themeToggle: $('themeToggle'), navHome: $('navHome'),
    navHistory: $('navHistory'), navGoTo: $('navGoTo'),
    navRandom: $('navRandom'), navTranslate: $('navTranslate')
};

// ============================================================
// STATE - Minimal
// ============================================================
const state = {
    groups: {}, playlists: [], groupNames: [],
    subs: [], subCache: {},
    iptv: [], iptvGroups: {}, iptvNames: [],
    category: 'playlists',
    view: 'groups',
    currentGroup: null,
    currentPlaylist: null,
    playingPlaylist: null,
    playingIndex: -1,
    viewingPlaylist: null,
    viewingIndex: -1,
    playbackMode: 0,
    isPlaying: false,
    isStopped: true,
    metadata: {},
    translate: {},
    translateEnabled: false,
    currentMode: 'tv',
    history: [],
    ytPlayer: null,
    isMuted: false,
    isIPTV: false,
    isYoutube: false,
    currentUrl: null,
    currentChannel: null,
    hls: null,
    navStack: ['groups'],
    timerInterval: null,
    isSeeking: false,
    videoEndedManually: false
};

// ============================================================
// UTILITY
// ============================================================
function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]); }

function formatTime(s) { if (!s || isNaN(s)) return '--:--'; const m=Math.floor(s/60), sec=Math.floor(s%60); return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }

function parseCSV(line) {
    const f=[]; let c='', q=false;
    for (let ch of line) {
        if (ch==='"') q=!q;
        else if (ch===','&&!q) { f.push(c.trim()); c=''; }
        else c+=ch;
    }
    f.push(c.trim());
    return f;
}

function showToast(msg, dur=2000, err=false) {
    if (!DOM.toast) return;
    if (window._toast) clearTimeout(window._toast);
    DOM.toast.textContent = msg;
    DOM.toast.style.display = 'block';
    DOM.toast.style.borderColor = err ? 'var(--accent)' : 'var(--border)';
    window._toast = setTimeout(() => DOM.toast.style.display = 'none', dur);
}

function updateClock() {
    const n=new Date();
    let h=n.getHours();
    const ap=h>=12?'PM':'AM';
    h=h%12||12;
    DOM.timeDisplay.textContent = h+':'+String(n.getMinutes()).padStart(2,'0')+' '+ap;
    DOM.dayDisplay.textContent = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n.getDay()];
}
setInterval(updateClock, 10000);
updateClock();

let dark=true;
function toggleTheme() {
    dark=!dark;
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
    DOM.themeToggle.textContent = dark?'🌙':'☀️';
    localStorage.setItem('shafin-theme', dark?'dark':'light');
}
if (localStorage.getItem('shafin-theme')==='light') {
    dark=false;
    document.documentElement.setAttribute('data-theme','light');
    DOM.themeToggle.textContent='☀️';
}

function isYoutube(url) { return url && (url.includes('youtube.com/watch')||url.includes('youtu.be/')||url.includes('youtube.com/live')); }

function getYoutubeId(url) {
    const m=url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
    return m?m[1]:null;
}

function destroyHls() { if(state.hls){try{state.hls.destroy()}catch(e){} state.hls=null; } }

// ============================================================
// PLAYBACK MODE
// ============================================================
function updateShuffle() {
    const icons=['➡️','🔀','🔁'];
    DOM.shuffle.textContent=icons[state.playbackMode];
    DOM.shuffle.className='control-btn shuffle-btn';
    const cls=['','active-shuffle','active-loop'];
    if(state.playbackMode>0) DOM.shuffle.classList.add(cls[state.playbackMode]);
}

function cycleShuffle() {
    state.playbackMode=(state.playbackMode+1)%3;
    updateShuffle();
    showToast(['Sequential','Shuffle','Loop'][state.playbackMode]+' Mode');
    saveState();
}

// ============================================================
// YOUTUBE PLAYER
// ============================================================
let ytLoaded=false;
function loadYT() {
    if(ytLoaded||typeof YT!=='undefined'){ytLoaded=true;return;}
    const t=document.createElement('script');
    t.src='https://www.youtube.com/iframe_api';
    t.onload=()=>{ytLoaded=true;};
    document.head.appendChild(t);
}

function createYT(videoId, autoplay=true, start=0) {
    if(typeof YT==='undefined'||!YT.Player) { setTimeout(()=>createYT(videoId,autoplay,start),300); return; }
    const gen=++state._gen||1; state._gen=gen;
    if(state.ytPlayer&&typeof state.ytPlayer.destroy==='function') try{state.ytPlayer.destroy()}catch(e){}
    state.ytPlayer=null;
    destroyHls();
    state.isIPTV=false; state.isYoutube=false;
    DOM.nativeVideo.style.display='none'; DOM.nativeVideo.pause(); DOM.iframe.style.display='none';
    state.isStopped=false; state.videoEndedManually=false;
    if(DOM.blank) DOM.blank.classList.remove('show');
    state.currentUrl=videoId;
    DOM.videoIdTile.textContent='ID: '+videoId.substring(0,8)+'...';
    DOM.videoIdTile.classList.add('show');
    
    const container=DOM.videoContainer;
    const pd=document.createElement('div');
    pd.id='yt-player-container';
    pd.style.cssText='width:100%;height:100%;position:relative;';
    const old=document.getElementById('yt-player-container');
    if(old) old.remove();
    DOM.iframe.style.display='none';
    DOM.placeholder.style.display='none';
    container.appendChild(pd);
    
    if(state.currentMode==='radio') { DOM.radioVisualizer.classList.add('active'); DOM.radioVisualizer.classList.remove('paused'); }
    
    state.ytPlayer=new YT.Player('yt-player-container', {
        height:'100%',width:'100%',videoId:videoId,
        playerVars:{rel:0,modestbranding:1,controls:1,fs:1,iv_load_policy:3,playsinline:1},
        events:{
            onReady:function(e){
                if(gen!==state._gen) return;
                state.isPlaying=true; DOM.play.textContent='⏸';
                let ss=0;
                try{const d=e.target.getDuration(); if(start>0&&d>0) ss=start>=Math.max(0,d-2)?0:start;}catch(e){}
                if(ss>0&&typeof e.target.seekTo==='function') try{e.target.seekTo(Math.floor(ss),true);}catch(e){}
                if(autoplay) e.target.playVideo();
                startTimer();
                if(state.isMuted&&typeof e.target.setVolume==='function') e.target.setVolume(0);
                updateRadioUI();
            },
            onStateChange:function(e){
                if(gen!==state._gen) return;
                const s=e.data;
                if(s===YT.PlayerState.PLAYING){ state.isPlaying=true; DOM.play.textContent='⏸'; state.videoEndedManually=false; startTimer(); if(DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused'); }
                else if(s===YT.PlayerState.PAUSED){ state.isPlaying=false; DOM.play.textContent='▶'; if(DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused'); }
                else if(s===YT.PlayerState.ENDED){ state.isPlaying=false; DOM.play.textContent='▶'; if(DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused'); if(!state.videoEndedManually&&!state.isStopped) setTimeout(()=>{ if(gen===state._gen&&state.playingPlaylist&&!state.isStopped) handleEnd(); },400); }
            },
            onError:function(){ if(gen===state._gen) showToast('Error',2000,true); }
        }
    });
}

// ============================================================
// IPTV PLAYER
// ============================================================
function playIPTV(url, name) {
    if(state.ytPlayer&&typeof state.ytPlayer.destroy==='function') try{state.ytPlayer.destroy()}catch(e){}
    state.ytPlayer=null;
    const c=document.getElementById('yt-player-container'); if(c) c.style.display='none';
    DOM.iframe.style.display='none';
    destroyHls();
    state.isIPTV=true; state.isYoutube=false;
    state.currentUrl=url; state.isStopped=false;
    if(DOM.blank) DOM.blank.classList.remove('show');
    DOM.placeholder.style.display='none';
    DOM.videoIdTile.textContent='📡 '+name.substring(0,18)+'...';
    DOM.videoIdTile.classList.add('show');
    
    if(state.currentMode==='radio') {
        DOM.radioVisualizer.classList.add('active');
        DOM.radioVisualizer.classList.remove('paused');
        DOM.radioTitle.textContent=name;
        DOM.radioSub.textContent='IPTV • Radio';
    }
    
    DOM.nativeVideo.style.display='block';
    DOM.nativeVideo.pause();
    DOM.nativeVideo.removeAttribute('src');
    DOM.nativeVideo.load();
    
    if(url.includes('.m3u8')&&Hls&&Hls.isSupported()) {
        state.hls=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:10});
        state.hls.loadSource(url);
        state.hls.attachMedia(DOM.nativeVideo);
        state.hls.on(Hls.Events.MANIFEST_PARSED,()=>{
            DOM.nativeVideo.play().catch(()=>{});
            state.isPlaying=true; DOM.play.textContent='⏸';
            if(DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused');
            startTimer();
        });
        state.hls.on(Hls.Events.ERROR,(e,d)=>{ if(d.fatal){ showToast('Stream error',2000,true); } });
    } else {
        DOM.nativeVideo.src=url;
        DOM.nativeVideo.addEventListener('canplay',()=>{
            DOM.nativeVideo.play().catch(()=>{});
            state.isPlaying=true; DOM.play.textContent='⏸';
            if(DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused');
            startTimer();
        },{once:true});
        DOM.nativeVideo.onerror=()=>{ showToast('Cannot play',2000,true); };
    }
    DOM.playerInfo.textContent='📡 '+name;
    updateRadioUI();
}

function playYoutubeStream(url, name) {
    const id=getYoutubeId(url);
    if(!id){showToast('Invalid YouTube URL',2000,true); return;}
    destroyHls(); state.isIPTV=false; state.isYoutube=true;
    state.currentUrl=url; state.isStopped=false;
    if(DOM.blank) DOM.blank.classList.remove('show');
    DOM.placeholder.style.display='none';
    DOM.videoIdTile.textContent='▶️ '+name.substring(0,18)+'...';
    DOM.videoIdTile.classList.add('show');
    
    if(state.currentMode==='radio') {
        DOM.radioVisualizer.classList.add('active');
        DOM.radioVisualizer.classList.remove('paused');
        DOM.radioTitle.textContent=name;
        DOM.radioSub.textContent='YouTube • Radio';
    }
    
    DOM.nativeVideo.style.display='none'; DOM.nativeVideo.pause();
    DOM.iframe.style.display='block';
    DOM.iframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0&enablejsapi=1`;
    state.isPlaying=true; DOM.play.textContent='⏸';
    DOM.playerInfo.textContent='▶️ '+name;
    updateRadioUI();
    startTimer();
}

function playStream(url, name) {
    if(isYoutube(url)) { playYoutubeStream(url,name); return; }
    playIPTV(url,name);
}

function handleEnd() {
    if(state.videoEndedManually){state.videoEndedManually=false; return;}
    if(state.isIPTV||state.isYoutube) return;
    const pl=state.playingPlaylist;
    if(!pl||!pl.videoIds||pl.videoIds.length===0) return;
    const idx=state.playingIndex;
    if(idx<0||idx>=pl.videoIds.length) return;
    let next;
    if(state.playbackMode===2) next=idx;
    else if(state.playbackMode===1) {
        let a=0;
        do{next=Math.floor(Math.random()*pl.videoIds.length); a++;} while(next===idx&&pl.videoIds.length>1&&a<20);
    } else next=(idx+1)%pl.videoIds.length;
    state.viewingPlaylist=pl; state.viewingIndex=next;
    playVideo(pl,next);
}

// ============================================================
// RADIO UI
// ============================================================
function updateRadioUI() {
    if(state.currentMode==='radio') {
        DOM.radioVisualizer.classList.add('active');
        DOM.radioVisualizer.classList.toggle('paused',!state.isPlaying);
        DOM.nativeVideo.style.display='none';
        const c=document.getElementById('yt-player-container'); if(c) c.style.display='none';
        DOM.iframe.style.display='none';
    } else {
        DOM.radioVisualizer.classList.remove('active');
        if(!state.isIPTV&&!state.isYoutube) {
            const c=document.getElementById('yt-player-container'); if(c) c.style.display='block';
            DOM.iframe.style.display='none'; DOM.nativeVideo.style.display='none';
        } else if(state.isIPTV) DOM.nativeVideo.style.display='block';
        else if(state.isYoutube) DOM.iframe.style.display='block';
    }
}

function setMode(m) {
    if(m===state.currentMode) return;
    state.currentMode=m;
    DOM.tvMode.classList.toggle('active',m==='tv');
    DOM.radioMode.classList.toggle('active',m==='radio');
    updateRadioUI();
    saveState();
}

// ============================================================
// CONTROLS
// ============================================================
function togglePlay() {
    if(state.isStopped){showToast('Select content first',1500,true); return;}
    if(state.isYoutube) {
        const id=getYoutubeId(state.currentUrl);
        if(id) {
            const p=DOM.play.textContent==='⏸';
            DOM.iframe.src=`https://www.youtube.com/embed/${id}?autoplay=${p?0:1}&rel=0&enablejsapi=1`;
            DOM.play.textContent=p?'▶':'⏸';
            state.isPlaying=!p;
            if(DOM.radioVisualizer) state.isPlaying?DOM.radioVisualizer.classList.remove('paused'):DOM.radioVisualizer.classList.add('paused');
        }
        return;
    }
    if(state.isIPTV) {
        if(DOM.nativeVideo.paused) {
            DOM.nativeVideo.play().catch(()=>{});
            state.isPlaying=true; DOM.play.textContent='⏸';
            if(DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused');
        } else {
            DOM.nativeVideo.pause();
            state.isPlaying=false; DOM.play.textContent='▶';
            if(DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused');
        }
        return;
    }
    if(state.ytPlayer&&typeof state.ytPlayer.playVideo==='function') {
        if(state.isPlaying) {
            state.ytPlayer.pauseVideo();
            state.isPlaying=false; DOM.play.textContent='▶';
            if(DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused');
        } else {
            state.videoEndedManually=false;
            state.ytPlayer.playVideo();
            state.isPlaying=true; DOM.play.textContent='⏸';
            if(DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused');
            startTimer();
        }
    }
}

function nextContent() {
    if(state.isIPTV||state.isYoutube) {
        if(state.iptv.length>0&&state.currentUrl) {
            const idx=state.iptv.findIndex(c=>c.url===state.currentUrl);
            if(idx>=0&&idx<state.iptv.length-1) {
                const n=state.iptv[idx+1];
                state.currentChannel=n;
                playStream(n.url,n.name);
                if(state.category==='iptv') renderIPTV();
                return;
            }
        }
        showToast('No next',1200,true);
        return;
    }
    if(!state.playingPlaylist||!state.playingPlaylist.videoIds||state.playingPlaylist.videoIds.length===0) {
        showToast('No playlist',1200,true);
        return;
    }
    state.videoEndedManually=false;
    const pl=state.playingPlaylist;
    let idx;
    if(state.playbackMode===1) {
        let a=0;
        do{idx=Math.floor(Math.random()*pl.videoIds.length); a++;} while(idx===state.playingIndex&&pl.videoIds.length>1&&a<20);
    } else idx=(state.playingIndex+1)%pl.videoIds.length;
    playVideo(pl,idx);
}

function prevContent() {
    if(state.isIPTV||state.isYoutube) {
        if(state.iptv.length>0&&state.currentUrl) {
            const idx=state.iptv.findIndex(c=>c.url===state.currentUrl);
            if(idx>0) {
                const p=state.iptv[idx-1];
                state.currentChannel=p;
                playStream(p.url,p.name);
                if(state.category==='iptv') renderIPTV();
                return;
            }
        }
        showToast('No previous',1200,true);
        return;
    }
    if(!state.playingPlaylist||!state.playingPlaylist.videoIds||state.playingPlaylist.videoIds.length===0) {
        showToast('No playlist',1200,true);
        return;
    }
    state.videoEndedManually=false;
    const pl=state.playingPlaylist;
    let idx;
    if(state.playbackMode===1) {
        let a=0;
        do{idx=Math.floor(Math.random()*pl.videoIds.length); a++;} while(idx===state.playingIndex&&pl.videoIds.length>1&&a<20);
    } else idx=(state.playingIndex-1+pl.videoIds.length)%pl.videoIds.length;
    playVideo(pl,idx);
}

function randomContent() {
    if(state.isIPTV||state.isYoutube) {
        if(state.iptv.length>0) {
            const ch=state.iptv[Math.floor(Math.random()*state.iptv.length)];
            state.currentChannel=ch;
            playStream(ch.url,ch.name);
            if(state.category==='iptv') renderIPTV();
            showToast('✨ Random channel');
        }
        return;
    }
    if(!state.playingPlaylist||!state.playingPlaylist.videoIds||state.playingPlaylist.videoIds.length===0) {
        showToast('No playlist',1200,true);
        return;
    }
    const pl=state.playingPlaylist;
    const idx=Math.floor(Math.random()*pl.videoIds.length);
    playVideo(pl,idx);
    showToast('✨ Random');
}

function seekVideo(s) {
    if(state.isIPTV) {
        const nt=Math.max(0,Math.min(DOM.nativeVideo.duration||0,DOM.nativeVideo.currentTime+s));
        DOM.nativeVideo.currentTime=nt;
        return;
    }
    if(!state.ytPlayer||typeof state.ytPlayer.seekTo!=='function') return;
    const c=state.ytPlayer.getCurrentTime();
    const d=state.ytPlayer.getDuration();
    const nt=Math.max(0,Math.min(d||0,c+s));
    state.ytPlayer.seekTo(nt,true);
    state.videoEndedManually=false;
}

function toggleMute() {
    if(state.isIPTV) {
        DOM.nativeVideo.muted=!DOM.nativeVideo.muted;
        state.isMuted=DOM.nativeVideo.muted;
        DOM.mute.textContent=state.isMuted?'🔇':'🔊';
        DOM.mute.classList.toggle('muted',state.isMuted);
        return;
    }
    state.isMuted=!state.isMuted;
    if(state.ytPlayer&&typeof state.ytPlayer.setVolume==='function') state.ytPlayer.setVolume(state.isMuted?0:70);
    DOM.mute.textContent=state.isMuted?'🔇':'🔊';
    DOM.mute.classList.toggle('muted',state.isMuted);
}

function stopPlayback() {
    state.isStopped=true;
    state.isIPTV=false; state.isYoutube=false;
    if(state.ytPlayer&&typeof state.ytPlayer.pauseVideo==='function') { state.ytPlayer.pauseVideo(); state.ytPlayer.stopVideo(); }
    destroyHls();
    DOM.nativeVideo.style.display='none'; DOM.nativeVideo.pause(); DOM.nativeVideo.removeAttribute('src'); DOM.nativeVideo.load();
    DOM.iframe.style.display='none'; DOM.iframe.src='';
    const c=document.getElementById('yt-player-container'); if(c) c.style.display='none';
    state.isPlaying=false; DOM.play.textContent='▶';
    if(DOM.radioVisualizer) DOM.radioVisualizer.classList.add('paused');
    DOM.blank.classList.add('show');
    DOM.playerInfo.textContent='Stopped';
    DOM.playerTimer.textContent='--:--';
    DOM.videoIdTile.classList.remove('show');
    DOM.progressBar.style.width='0%';
    stopTimer();
    showToast('⏹ Stopped');
}

function goToCurrent() {
    if(state.isIPTV||state.isYoutube) {
        if(state.currentChannel) {
            switchCategory('iptv');
            setTimeout(()=>{
                renderIPTV();
                setTimeout(()=>{
                    const items=DOM.list.querySelectorAll('.list-item[data-type="iptv"]');
                    for(let item of items) {
                        if(item.dataset.url===state.currentChannel.url) {
                            item.scrollIntoView({block:'center'});
                            item.classList.add('active');
                            setTimeout(()=>item.classList.remove('active'),1500);
                            break;
                        }
                    }
                },150);
            },100);
        }
        return;
    }
    if(state.playingPlaylist) {
        const pl=state.playingPlaylist;
        for(const g in state.groups) {
            for(const p of state.groups[g]) {
                if(p.name===pl.name&&p.group===pl.group) {
                    switchCategory('playlists');
                    setTimeout(()=>{
                        navigateGroup(g);
                        setTimeout(()=>{
                            const items=DOM.list.querySelectorAll('.list-item[data-type="playlist"]');
                            for(let item of items) {
                                const idx=parseInt(item.dataset.index);
                                if(state.groups[g]&&state.groups[g][idx]&&state.groups[g][idx].name===pl.name) {
                                    item.click();
                                    setTimeout(()=>{
                                        const vids=DOM.list.querySelectorAll('.list-item[data-type="video"]');
                                        if(vids[state.playingIndex]) {
                                            vids[state.playingIndex].scrollIntoView({block:'center'});
                                            vids[state.playingIndex].classList.add('active');
                                            setTimeout(()=>vids[state.playingIndex].classList.remove('active'),1500);
                                        }
                                    },150);
                                    break;
                                }
                            }
                        },150);
                    },100);
                    return;
                }
            }
        }
        showToast('Could not locate',1500,true);
    }
}

// ============================================================
// TIMER
// ============================================================
function startTimer() {
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval=setInterval(()=>{ updateTimer(); updateProgress(); },500);
}

function stopTimer() {
    if(state.timerInterval){clearInterval(state.timerInterval); state.timerInterval=null;}
}

function updateTimer() {
    if(state.isIPTV) {
        if(DOM.nativeVideo&&DOM.nativeVideo.duration) {
            const c=DOM.nativeVideo.currentTime, d=DOM.nativeVideo.duration;
            if(d>0) DOM.playerTimer.textContent=formatTime(c)+' / '+formatTime(d);
        }
        return;
    }
    if(!state.ytPlayer||typeof state.ytPlayer.getCurrentTime!=='function') return;
    const c=state.ytPlayer.getCurrentTime(), d=state.ytPlayer.getDuration();
    if(d&&d>0) DOM.playerTimer.textContent=formatTime(c)+' / '+formatTime(d);
}

function updateProgress() {
    if(state.isIPTV) {
        if(DOM.nativeVideo&&DOM.nativeVideo.duration) {
            const c=DOM.nativeVideo.currentTime, d=DOM.nativeVideo.duration;
            if(d>0) DOM.progressBar.style.width=Math.min((c/d)*100,100)+'%';
        }
        return;
    }
    if(!state.ytPlayer||typeof state.ytPlayer.getCurrentTime!=='function') return;
    if(state.isSeeking) return;
    const c=state.ytPlayer.getCurrentTime(), d=state.ytPlayer.getDuration();
    if(d&&d>0) DOM.progressBar.style.width=Math.min((c/d)*100,100)+'%';
}

function setupProgress() {
    let drag=false;
    DOM.progressContainer.addEventListener('mousedown',function(e){
        if(state.isIPTV){ drag=true; state.isSeeking=true; seekIPTV(e); return; }
        if(!state.ytPlayer||typeof state.ytPlayer.seekTo!=='function') return;
        drag=true; state.isSeeking=true; seekYT(e);
    });
    document.addEventListener('mousemove',function(e){ if(!drag) return; if(state.isIPTV){seekIPTV(e);return;} seekYT(e); });
    document.addEventListener('mouseup',function(){ if(drag){drag=false; setTimeout(()=>state.isSeeking=false,200);} });
    DOM.progressContainer.addEventListener('touchstart',function(e){
        if(state.isIPTV){ state.isSeeking=true; seekIPTVTouch(e); return; }
        if(!state.ytPlayer||typeof state.ytPlayer.seekTo!=='function') return;
        state.isSeeking=true; seekYTTouch(e);
    });
    DOM.progressContainer.addEventListener('touchmove',function(e){
        e.preventDefault();
        if(state.isIPTV){seekIPTVTouch(e);return;}
        if(!state.ytPlayer) return;
        seekYTTouch(e);
    });
    DOM.progressContainer.addEventListener('touchend',function(){ setTimeout(()=>state.isSeeking=false,200); });
}

function seekYT(e) {
    const r=DOM.progressContainer.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const d=state.ytPlayer.getDuration();
    if(d&&d>0){ state.ytPlayer.seekTo(p*d,true); DOM.progressBar.style.width=(p*100)+'%'; state.videoEndedManually=false; }
}
function seekYTTouch(e) {
    const t=e.touches[0]; if(!t) return;
    const r=DOM.progressContainer.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(t.clientX-r.left)/r.width));
    const d=state.ytPlayer.getDuration();
    if(d&&d>0){ state.ytPlayer.seekTo(p*d,true); DOM.progressBar.style.width=(p*100)+'%'; state.videoEndedManually=false; }
}
function seekIPTV(e) {
    const r=DOM.progressContainer.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    const d=DOM.nativeVideo.duration;
    if(d>0){ DOM.nativeVideo.currentTime=p*d; DOM.progressBar.style.width=(p*100)+'%'; }
}
function seekIPTVTouch(e) {
    const t=e.touches[0]; if(!t) return;
    const r=DOM.progressContainer.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(t.clientX-r.left)/r.width));
    const d=DOM.nativeVideo.duration;
    if(d>0){ DOM.nativeVideo.currentTime=p*d; DOM.progressBar.style.width=(p*100)+'%'; }
}

// PLAYLIST VIDEO PLAYER
// ============================================================
function playVideo(playlist, index, start=0) {
    if(!playlist||!playlist.videoIds||index<0||index>=playlist.videoIds.length) return;
    state.isIPTV=false; state.isYoutube=false;
    state.playingPlaylist=playlist;
    state.playingIndex=index;
    state.viewingPlaylist=playlist;
    state.viewingIndex=index;
    state.videoEndedManually=false;
    if(DOM.blank) DOM.blank.classList.remove('show');
    const id=playlist.videoIds[index];
    if(!id) return;
    const cache=state.metadata[playlist.name]||{};
    const meta=cache[id];
    let title=meta?meta.title:'Video '+(index+1);
    if(state.translateEnabled&&meta&&meta.translatedTitle) title=meta.translatedTitle;
    let thumb=meta?meta.thumbnail:'https://img.youtube.com/vi/'+id+'/mqdefault.jpg';
    if(DOM.placeholder) DOM.placeholder.style.display='none';
    
    if(state.currentMode==='radio') {
        DOM.radioVisualizer.classList.add('active');
        DOM.radioVisualizer.classList.remove('paused');
        DOM.radioTitle.textContent=title;
        DOM.radioSub.textContent=playlist.name+' • Radio';
    }
    DOM.playerInfo.textContent=playlist.name+' • '+title;
    DOM.progressBar.style.width='0%';
    
    if(typeof YT!=='undefined'&&YT.Player) createYT(id,true,start);
    else fallbackIframe(id);
    if(state.viewingPlaylist===playlist) renderVideos(playlist);
    saveState();
}

function fallbackIframe(id) {
    state.isStopped=false; state.videoEndedManually=false;
    if(DOM.blank) DOM.blank.classList.remove('show');
    DOM.videoIdTile.textContent='ID: '+id.substring(0,8)+'...';
    DOM.videoIdTile.classList.add('show');
    const c=document.getElementById('yt-player-container'); if(c) c.style.display='none';
    DOM.nativeVideo.style.display='none';
    DOM.iframe.style.display='block';
    DOM.iframe.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&enablejsapi=1&playsinline=1';
    state.isPlaying=true; DOM.play.textContent='⏸';
    if(DOM.radioVisualizer) DOM.radioVisualizer.classList.remove('paused');
    startTimer();
}

function getIcon(name) {
    const l=name.toLowerCase();
    if(l.includes('quran')) return '📖';
    if(l.includes('music')) return '🎵';
    if(l.includes('movie')) return '🎬';
    if(l.includes('islam')) return '🕌';
    if(l.includes('live tv')||l.includes('tv')) return '📺';
    if(l.includes('news')) return '📰';
    if(l.includes('sports')) return '⚽';
    return '📁';
}

function renderVideos(playlist) {
    const search=DOM.search.value.toLowerCase().trim();
    const cache=state.metadata[playlist.name]||{};
    let videos=playlist.videoIds.map((id,i)=>({id,index:i}));
    if(search) videos=videos.filter(v=>{
        const m=cache[v.id];
        if(m){
            const t=state.translateEnabled&&m.translatedTitle?m.translatedTitle:m.title;
            return t.toLowerCase().includes(search);
        }
        return false;
    });
    let html='<div style="padding:2px 6px;font-size:0.55rem;color:var(--text2);border-bottom:1px solid var(--border);margin-bottom:2px;display:flex;justify-content:space-between;">'+

        '<span>'+Object.keys(cache).length+'/'+playlist.videoIds.length+'</span></div>';
    if(!videos.length&&search){ html+='<div style="text-align:center;padding:15px;font-size:0.55rem;color:var(--text2);">No matches</div>'; DOM.list.innerHTML=html; return; }
    videos.forEach(v=>{
        const active=state.viewingPlaylist===playlist&&state.viewingIndex===v.index;
        const m=cache[v.id];
        let title=m?m.title:'Video '+(v.index+1);
        let translated=false;
        if(state.translateEnabled&&m&&m.translatedTitle){ title=m.translatedTitle; translated=true; }
        const thumb=m?m.thumbnail:'https://img.youtube.com/vi/'+v.id+'/mqdefault.jpg';
        const badge=translated?'<span class="translated-badge">🌐</span>':'';
        html+='<div class="list-item '+(active?'active':'')+'" data-video-index="'+v.index+'" data-type="video">'+
            '<img class="thumb" src="'+thumb+'" alt="" loading="lazy">'+

            '<div class="sub">'+escapeHtml(m?m.author:'')+'</div></div>'+
            '<span class="badge">'+(v.index+1)+'</span></div>';

    DOM.list.querySelectorAll('.list-item[data-type="video"]').forEach(el=>{
        el.addEventListener('click',function(){
            const idx=parseInt(this.dataset.videoIndex);
            state.videoEndedManually=false;

    state.view='iptv';
    DOM.back.classList.add('show');
    DOM.search.placeholder='Search channels...';
    DOM.search.value='';
    if(state.navStack[state.navStack.length-1]!=='iptv') state.navStack.push('iptv');

}

function goBack() {
    if(state.navStack.length<=1){ 
        if(state.category==='playlists') navigateGroups();
        else if(state.category==='subscriptions') navigateSubs();
        else if(state.category==='iptv') navigateIPTV();
        return;
    }
    state.navStack.pop();
    const last=state.navStack[state.navStack.length-1];
    if(last==='groups') navigateGroups();
    else if(last==='subscriptions') navigateSubs();
    else if(last==='iptv') navigateIPTV();
    else if(last.startsWith('group:')) navigateGroup(last.replace('group:',''));
    else if(last.startsWith('playlist:')){
        const pl=state.playlists.find(p=>p.name===last.replace('playlist:',''));
        if(pl) navigatePlaylist(pl); else navigateGroups();
    } else if(last.startsWith('sub_videos:')){
        const ch=state.subs.find(s=>s.name===last.replace('sub_videos:',''));
        if(ch) navigateSubVideos(ch); else navigateSubs();
    } else navigateGroups();
}

async function loadSubs() {
    try {
        // Load from cache first
        try {
            const cached=localStorage.getItem('shafin_subs');
            if(cached){
                const data=JSON.parse(cached);
                if(data.channels&&data.channels.length>0){
                    state.subs=data.channels;
                    state.subCache=data.videos||{};
                    if(state.category==='subscriptions') renderSubs();
                    DOM.status.textContent='📺 '+state.subs.length+' subs';
                }
            }
        } catch(e){}
        
        // Fetch fresh in background
        const resp=await fetch(CONFIG.SUBSCRIPTIONS);
        if(!resp.ok) throw new Error('HTTP '+resp.status);
        const csv=await resp.text();
        const rows=csv.split(/\r?\n/).filter(r=>r.trim());
        state.subs=[];
        for(let i=1;i<rows.length;i++){
            const f=parseCSV(rows[i]);
            if(f.length<2) continue;
            const name=f[0]?.trim()||'', id=f[1]?.trim()||'', group=f[2]?.trim()||'Uncategorized';
            if(name&&id) state.subs.push({name,channelId:id,group});
        }
        // Cache channels
        try {
            localStorage.setItem('shafin_subs', JSON.stringify({channels:state.subs, videos:state.subCache, time:Date.now()}));
        } catch(e){}
        DOM.status.textContent='📺 '+state.subs.length+' subs';
        if(state.category==='subscriptions') renderSubs();
    } catch(err){ console.warn('Subs error:',err); }
}

function renderSubs() {

// ============================================================
// METADATA - CACHED & FAST
// ============================================================
async function fetchMeta(playlist) {
    if(!playlist||!playlist.videoIds||playlist.videoIds.length===0) return;
    const key=playlist.name;
    if(!state.metadata[key]) state.metadata[key]={};
    const cache=state.metadata[key];
    const pending=playlist.videoIds.filter(id=>!cache[id]);
    if(!pending.length) return;
    // Load from cache first
    try {
        const cached=localStorage.getItem('shafin_meta');
        if(cached){
            const data=JSON.parse(cached);
            if(data[key]){
                Object.assign(cache, data[key]);
                if(state.viewingPlaylist===playlist) renderVideos(playlist);
                return;
            }
        }
    } catch(e){}
    // Fetch in small batches
    const batchSize=3;
    for(let i=0;i<pending.length;i+=batchSize){
        const batch=pending.slice(i,i+batchSize);
        await Promise.all(batch.map(async id=>{
            try {
                const resp=await fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v='+id+'&format=json');
                if(resp.ok){
                    const data=await resp.json();
                    cache[id]={title:data.title||'Video '+id, author:data.author_name||'Unknown',
                        thumbnail:data.thumbnail_url||'https://img.youtube.com/vi/'+id+'/mqdefault.jpg'};
                } else {
                    cache[id]={title:'Video '+id, author:'Unknown', thumbnail:'https://img.youtube.com/vi/'+id+'/mqdefault.jpg'};
                }
            } catch(e){
                cache[id]={title:'Video '+id, author:'Unknown', thumbnail:'https://img.youtube.com/vi/'+id+'/mqdefault.jpg'};
            }
        }));
        if(state.viewingPlaylist===playlist) renderVideos(playlist);
        await new Promise(r=>setTimeout(r,10));
    }
    try {
        localStorage.setItem('shafin_meta', JSON.stringify(state.metadata));
    } catch(e){}
}

// ============================================================
// TRANSLATION
// ============================================================
async function translateText(text){
    if(!text||text.length<2) return text;
    const key=text.substring(0,100);
    if(state.translate[key]) return state.translate[key];
    try {
        const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q='+encodeURIComponent(text);
        const resp=await fetch(url);
        if(!resp.ok) throw new Error();
        const data=await resp.json();
        if(data&&data[0]&&data[0][0]&&data[0][0][0]){
            const t=data[0][0][0];
            state.translate[key]=t;
            localStorage.setItem('shafin_translate', JSON.stringify(state.translate));
            return t;
        }
        return text;
    } catch(e){ return text; }
}

function toggleTranslate(){
    state.translateEnabled=!state.translateEnabled;
    DOM.navTranslate.classList.toggle('active',state.translateEnabled);
    showToast(state.translateEnabled?'🌐 ON':'🌐 OFF');
    if(state.view==='playlist'&&state.viewingPlaylist) renderVideos(state.viewingPlaylist);
    if(state.view==='sub_videos'&&state.currentSubscription) renderSubVideos(state.currentSubscription);
    saveState();
}

// ============================================================
// HISTORY
// ============================================================
function loadHistory(){
    try{const r=localStorage.getItem('shafin_history'); if(r) state.history=JSON.parse(r);}catch(e){state.history=[];}
}

function saveHistory(){
    try{const cutoff=Date.now()-7*24*60*60*1000; state.history=state.history.filter(h=>h.timestamp>cutoff); localStorage.setItem('shafin_history',JSON.stringify(state.history));}catch(e){}
}

function renderHistory(){
    if(!state.history.length){ DOM.historyList.innerHTML='<div class="empty">No history</div>'; return; }
    // We'll use a simple modal approach - show in a toast for simplicity
    const items=state.history.slice(0,10).map(h=>h.title).join('\n');
    showToast('📜 '+state.history.length+' items', 4000);
}

// ============================================================
// PLAYLIST LOADING - FAST
// ============================================================
async function loadPlaylists() {
    try {
        // Load from cache first
        try {
            const cached=localStorage.getItem('shafin_playlists');
            if(cached){
                const data=JSON.parse(cached);
                if(data.groups&&data.playlists){
                    state.groups=data.groups;
                    state.playlists=data.playlists;
                    state.groupNames=Object.keys(state.groups).sort();
                    if(state.category==='playlists') navigateGroups();
                    DOM.status.textContent='📋 '+state.playlists.length+' playlists';
                }
            }
        } catch(e){}
        
        const resp=await fetch(CONFIG.PLAYLIST);
        if(!resp.ok) throw new Error('HTTP '+resp.status);
        const csv=await resp.text();
        const rows=csv.split(/\r?\n/).filter(r=>r.trim());
        state.groups={}; state.playlists=[]; state.groupNames=[];
        for(let i=1;i<rows.length;i++){
            const f=parseCSV(rows[i]);
            if(f.length<2) continue;
            const name=f[0]?.trim()||'', idsRaw=f[1]?.trim()||'', group=f[2]?.trim()||'Uncategorized';
            if(!name||!idsRaw) continue;
            const ids=idsRaw.split(',').map(id=>id.trim()).filter(id=>id.length===11);
            if(!ids.length) continue;
            const pl={name,videoIds:ids,group};
            state.playlists.push(pl);
            if(!state.groups[group]) state.groups[group]=[];
            state.groups[group].push(pl);
        }
        state.groupNames=Object.keys(state.groups).sort();
        // Cache
        try {
            localStorage.setItem('shafin_playlists', JSON.stringify({groups:state.groups, playlists:state.playlists, time:Date.now()}));
        } catch(e){}
        DOM.status.textContent='📋 '+state.playlists.length+' playlists';
        if(state.category==='playlists') navigateGroups();
    } catch(err) {
        DOM.status.textContent='❌ Error';
        showToast('Playlist error',3000,true);
    }
}

// ============================================================
// SAVE STATE
// ============================================================
function saveState(){
    try {
        localStorage.setItem('shafin_state', JSON.stringify({
            playbackMode:state.playbackMode,
            currentMode:state.currentMode,
            translateEnabled:state.translateEnabled
        }));
    } catch(e){}
}

function restoreState(){
    try {
        const raw=localStorage.getItem('shafin_state');
        if(raw){
            const data=JSON.parse(raw);
            if(data.playbackMode!==undefined) state.playbackMode=data.playbackMode;
            if(data.currentMode) state.currentMode=data.currentMode;
            if(data.translateEnabled!==undefined) state.translateEnabled=data.translateEnabled;
            if(state.translateEnabled) DOM.navTranslate.classList.add('active');
            updateShuffle();
            setMode(state.currentMode);
        }
    } catch(e){}
}

// ============================================================
// MANUAL INPUT
// ============================================================
function playManual() {
    const url=DOM.manualInput.value.trim();
    if(!url){showToast('Enter URL',1500,true); return;}
    if(!isYoutube(url)&&(url.includes('.m3u8')||url.includes('.ts')||url.includes('http'))){
        const ch={name:'Custom Stream',url:url,category:'Custom'};
        state.currentChannel=ch; state.currentUrl=url;
        playStream(url,'Custom Stream');
        return;
    }
    const id=getYoutubeId(url);
    if(!id){showToast('Invalid URL',2000,true); return;}
    let pl=state.playlists.find(p=>p.name==='Custom'&&p.videoIds[0]===id);
    if(!pl){
        pl={name:'Custom',videoIds:[id],group:'Custom'};
        const ex=state.playlists.find(p=>p.name==='Custom');
        if(!ex){ state.playlists.push(pl); if(!state.groups['Custom']){state.groups['Custom']=[];} state.groups['Custom'].push(pl); if(!state.groupNames.includes('Custom')) state.groupNames.push('Custom'); }
        else { if(!ex.videoIds.includes(id)){ex.videoIds.push(id);} pl=ex; }
    }
    state.isIPTV=false; state.isYoutube=false;
    state.playingPlaylist=pl; state.playingIndex=0;
    state.viewingPlaylist=pl; state.viewingIndex=0;
    navigatePlaylist(pl);
    fetchMeta(pl);
    setTimeout(()=>playVideo(pl,0),200);
}

// ============================================================
// INIT - FASTEST
// ============================================================
async function init() {
    console.log('🔴 Shafin Tube v6 - Minimal & Fast');
    loadHistory();
    restoreState();
    updateShuffle();
    setMode(state.currentMode);
    setupProgress();
    loadYT();
    
    // Load playlists first (fastest)
    await loadPlaylists();
    
    // Load subs and IPTV in background
    setTimeout(loadSubs, 300);
    setTimeout(loadIPTV, 600);
    
    // Setup events
    setupEvents();
    
    // Show groups
    navigateGroups();
    console.log('✅ Ready');
}

function setupEvents() {
    // Category buttons
    document.querySelectorAll('.header-btn.category-btn').forEach(b=>{
        b.addEventListener('click',()=>switchCategory(b.dataset.category));
    });
    
    DOM.home.addEventListener('click', ()=>{
        if(state.category==='playlists') navigateGroups();
        else if(state.category==='subscriptions') navigateSubs();
        else if(state.category==='iptv') navigateIPTV();
        DOM.search.value='';
        showToast('🏠 Home');
    });
    
    DOM.back.addEventListener('click', goBack);
    
    DOM.search.addEventListener('input', ()=>{
        clearTimeout(window._search);
        window._search=setTimeout(()=>{
            if(state.view==='groups') renderGroups();
            else if(state.view==='group'&&state.currentGroup) renderGroupPlaylists(state.currentGroup);
            else if(state.view==='playlist'&&state.viewingPlaylist) renderVideos(state.viewingPlaylist);
            else if(state.view==='subscriptions') renderSubs();
            else if(state.view==='sub_videos'&&state.currentSubscription) renderSubVideos(state.currentSubscription);
            else if(state.view==='iptv') renderIPTV();
        },100);
    });
    
    // Controls
    DOM.play.addEventListener('click', togglePlay);
    DOM.prev.addEventListener('click', prevContent);
    DOM.next.addEventListener('click', nextContent);
    DOM.shuffle.addEventListener('click', cycleShuffle);
    DOM.mute.addEventListener('click', toggleMute);
    DOM.manualPlay.addEventListener('click', playManual);
    DOM.manualInput.addEventListener('keydown', e=>{if(e.key==='Enter') playManual();});
    DOM.videoIdTile.addEventListener('click', ()=>{
        if(state.currentUrl) {
            navigator.clipboard.writeText(state.currentUrl).then(()=>showToast('📋 Copied')).catch(()=>{});
        }
    });
    
    // Mode
    DOM.tvMode.addEventListener('click', ()=>setMode('tv'));
    DOM.radioMode.addEventListener('click', ()=>setMode('radio'));
    
    // Bottom nav
    DOM.navHome.addEventListener('click', ()=>{
        if(state.category==='playlists') navigateGroups();
        else if(state.category==='subscriptions') navigateSubs();
        else if(state.category==='iptv') navigateIPTV();
        DOM.search.value='';
        document.querySelectorAll('.bottom-nav .nav-btn').forEach(b=>b.classList.remove('active'));
        DOM.navHome.classList.add('active');
    });
    DOM.navHistory.addEventListener('click', ()=>{
        renderHistory();
        document.querySelectorAll('.bottom-nav .nav-btn').forEach(b=>b.classList.remove('active'));
        DOM.navHistory.classList.add('active');
    });
    DOM.navGoTo.addEventListener('click', ()=>{
        goToCurrent();
        document.querySelectorAll('.bottom-nav .nav-btn').forEach(b=>b.classList.remove('active'));
        DOM.navGoTo.classList.add('active');
    });
    DOM.navRandom.addEventListener('click', ()=>{
        randomContent();
        document.querySelectorAll('.bottom-nav .nav-btn').forEach(b=>b.classList.remove('active'));
        DOM.navRandom.classList.add('active');
    });
    DOM.navTranslate.addEventListener('click', ()=>{
        toggleTranslate();
        document.querySelectorAll('.bottom-nav .nav-btn').forEach(b=>b.classList.remove('active'));
        DOM.navTranslate.classList.add('active');
    });
    DOM.themeToggle.addEventListener('click', toggleTheme);
    
    // Keyboard shortcuts
    document.addEventListener('keydown', e=>{
        if(e.target.tagName==='INPUT') return;
        if(e.key==='ArrowLeft'){e.preventDefault(); seekVideo(-10);}
        else if(e.key==='ArrowRight'){e.preventDefault(); seekVideo(10);}
        else if(e.key===' '||e.key==='Spacebar'){e.preventDefault(); togglePlay();}
        else if(e.key==='Escape'){ if(state.view!=='groups'&&state.view!=='subscriptions'&&state.view!=='iptv') goBack(); }
        else if(e.key==='n'||e.key==='N'){e.preventDefault(); nextContent();}
        else if(e.key==='b'||e.key==='B'){e.preventDefault(); prevContent();}
        else if(e.key==='r'||e.key==='R'){randomContent();}
        else if(e.key==='m'||e.key==='M'){toggleMute();}
        else if(e.key==='s'||e.key==='S'){cycleShuffle();}
        else if(e.key==='t'||e.key==='T'){toggleTranslate();}
        else if(e.key==='x'||e.key==='X'){stopPlayback();}
        else if(e.key==='l'||e.key==='L'){goToCurrent();}
        else if(e.key==='Home'){e.preventDefault(); DOM.home.click();}
    });
}

// Start
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
