<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Shafin Tube</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23000000'/><rect x='15' y='25' width='70' height='50' rx='8' fill='%231a1a1a' stroke='%232a2a2a' stroke-width='2'/><rect x='35' y='38' width='30' height='24' rx='4' fill='%23ff0000'/><circle cx='50' cy='50' r='6' fill='%23ffffff'/></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0a0a0a;
            --bg2: #111111;
            --bg3: #1a1a1a;
            --bg4: #222222;
            --text: #f0f0f0;
            --text2: #999999;
            --border: #1e1e1e;
            --shadow: rgba(0,0,0,0.6);
            --card-bg: #0d0d0d;
            --hover: #1e1e1e;
            --accent: #ff0000;
            --accent2: #cc0000;
            --radius: 8px;
            --transition: 0.2s ease;
        }
        [data-theme="light"] {
            --bg: #f0f0f0;
            --bg2: #e8e8e8;
            --bg3: #dddddd;
            --bg4: #cccccc;
            --text: #111111;
            --text2: #555555;
            --border: #cccccc;
            --shadow: rgba(0,0,0,0.08);
            --card-bg: #f8f8f8;
            --hover: #e0e0e0;
            --accent: #e60000;
            --accent2: #b30000;
        }
        html, body { height: 100%; overflow: hidden; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; transition: background var(--transition), color var(--transition); }
        .app { display: flex; flex-direction: column; height: 100vh; max-width: 100vw; overflow: hidden; }
        
        /* Header */
        .header { background: var(--bg2); padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; min-height: 52px; gap: 10px; flex-wrap: wrap; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--bg3); flex-shrink: 0; }
        .logo-text { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
        .logo-text span { color: var(--accent); }
        .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .status-badge { font-size: 0.6rem; color: var(--text2); background: var(--bg3); padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); white-space: nowrap; }
        .theme-toggle, .edit-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: all var(--transition); text-decoration: none; flex-shrink: 0; }
        .theme-toggle:hover, .edit-btn:hover { background: var(--bg4); }
        
        /* Main Content: Sidebar + Player */
        .main-content { display: flex; flex: 1; overflow: hidden; min-height: 0; }
        
        /* Sidebar */
        .sidebar { width: 320px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        .sidebar-header { padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .sidebar-search { width: 100%; padding: 6px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 0.75rem; outline: none; }
        .sidebar-search:focus { border-color: var(--accent); }
        .sidebar-search::placeholder { color: var(--text2); }
        
        /* Playlist / Video list container */
        .list-container { flex: 1; overflow-y: auto; padding: 6px 8px; -webkit-overflow-scrolling: touch; }
        .list-container::-webkit-scrollbar { width: 4px; }
        .list-container::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
        
        /* List items */
        .list-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 2px 0; border-radius: var(--radius); cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; }
        .list-item:hover { background: var(--hover); }
        .list-item.active { background: var(--bg3); border-left-color: var(--accent); }
        .list-item .icon { font-size: 1.2rem; flex-shrink: 0; width: 28px; text-align: center; }
        .list-item .info { flex: 1; min-width: 0; }
        .list-item .title { font-size: 0.8rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
        .list-item .sub { font-size: 0.65rem; color: var(--text2); margin-top: 1px; }
        .list-item .badge { font-size: 0.55rem; background: var(--bg4); padding: 1px 8px; border-radius: 12px; color: var(--text2); flex-shrink: 0; }
        .list-item .video-count { font-size: 0.6rem; color: var(--text2); margin-left: auto; padding-left: 8px; flex-shrink: 0; }
        
        /* Back button when viewing videos */
        .back-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 0.7rem; margin-bottom: 6px; display: none; align-items: center; gap: 4px; width: fit-content; }
        .back-btn:hover { background: var(--bg4); }
        .back-btn.show { display: flex; }
        
        /* Player Area */
        .player-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; overflow: hidden; }
        .video-container { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        .video-container .placeholder { color: var(--text2); font-size: 0.9rem; text-align: center; padding: 20px; }
        .video-container .placeholder .big-icon { font-size: 3rem; display: block; margin-bottom: 12px; }
        
        /* Controls */
        .controls { background: var(--bg2); padding: 8px 16px; display: flex; align-items: center; justify-content: center; gap: 12px; border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
        .control-btn { width: 36px; height: 36px; border-radius: 50%; font-size: 0.9rem; background: var(--bg3); border: 1px solid var(--border); color: var(--text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition); }
        .control-btn:hover { background: var(--bg4); }
        .control-btn:active { transform: scale(0.94); }
        .control-btn.shuffle-btn { background: var(--accent); border-color: var(--accent); color: #fff; }
        .control-btn.shuffle-btn:hover { background: var(--accent2); }
        .player-info-text { font-size: 0.7rem; color: var(--text2); flex: 1; min-width: 100px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* Toast */
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--bg3); color: var(--text); padding: 6px 16px; border-radius: 25px; font-size: 0.7rem; border: 1px solid var(--border); z-index: 2000; animation: toastIn 0.3s ease; max-width: 90%; text-align: center; box-shadow: 0 8px 24px var(--shadow); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .toast.hidden { display: none; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 260px; }
            .header { padding: 6px 10px; min-height: 44px; }
            .logo-text { font-size: 0.95rem; }
            .logo-img { width: 28px; height: 28px; }
            .theme-toggle, .edit-btn { width: 28px; height: 28px; font-size: 0.8rem; }
            .list-item { padding: 8px 10px; }
            .list-item .title { font-size: 0.75rem; }
            .control-btn { width: 32px; height: 32px; font-size: 0.8rem; }
            .player-info-text { font-size: 0.6rem; min-width: 60px; }
        }
        @media (max-width: 480px) {
            .sidebar { width: 220px; }
            .sidebar-header { padding: 6px 8px; }
            .sidebar-search { font-size: 0.65rem; padding: 4px 10px; }
            .list-item { padding: 6px 8px; gap: 6px; }
            .list-item .title { font-size: 0.7rem; }
            .list-item .sub { font-size: 0.55rem; }
            .list-item .icon { font-size: 1rem; width: 22px; }
            .controls { gap: 8px; padding: 6px 10px; }
            .control-btn { width: 28px; height: 28px; font-size: 0.7rem; }
            .player-info-text { font-size: 0.55rem; min-width: 40px; }
            .header { gap: 4px; }
            .status-badge { font-size: 0.5rem; padding: 2px 6px; }
        }
        @media (max-width: 380px) {
            .sidebar { width: 180px; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Header -->
    <header class="header">
        <div class="logo-area">
            <img class="logo-img" src="https://i.postimg.cc/yYbyhL4w/Rounded-Profile.png" alt="Shafin Tube" onerror="this.style.display='none'">
            <div class="logo-text">Shafin<span>Tube</span></div>
        </div>
        <div class="header-actions">
            <span class="status-badge" id="statusBadge">📡 Loading...</span>
            <a class="edit-btn" id="editBtn" href="https://docs.google.com/spreadsheets/d/18-uFLokAHJVXJgRfd7nbL7GRUNHgzbdu1Nfs9fVaFqw/edit?usp=sharing" target="_blank" title="Edit Google Sheet">✎</a>
            <button class="theme-toggle" id="themeToggle" title="Toggle Theme">🌙</button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <input class="sidebar-search" id="searchInput" type="text" placeholder="🔍 Search playlists...">
                <button class="back-btn" id="backBtn">‹ Back to Playlists</button>
            </div>
            <div class="list-container" id="listContainer">
                <div style="text-align:center; padding:40px 16px; font-size:0.75rem; color:var(--text2);">Loading playlists...</div>
            </div>
        </div>

        <!-- Player Area -->
        <div class="player-area">
            <div class="video-container" id="videoContainer">
                <div class="placeholder" id="placeholder">
                    <span class="big-icon">🎬</span>
                    <p>Select a playlist and video to start</p>
                </div>
                <iframe id="playerIframe" src="" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen style="display:none;"></iframe>
            </div>
            <div class="controls">
                <button class="control-btn" id="prevBtn" title="Previous">⏮</button>
                <button class="control-btn" id="playBtn" title="Play/Pause">⏸</button>
                <button class="control-btn" id="nextBtn" title="Next">⏭</button>
                <button class="control-btn shuffle-btn" id="shuffleBtn" title="Toggle Shuffle">🎲</button>
                <span class="player-info-text" id="playerInfo">No video playing</span>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast hidden" id="toast"></div>

<script>
    // ============================================================
    // CONFIG
    // ============================================================
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRx0WsM-o0uDBYquZ2jkvScyk_VKetZ2PQ-92qSpjx3PZIRqUyrlCP4DIDIXOcIUsXazIfJqcun7LAp/pub?gid=0&single=true&output=csv";
    const SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/18-uFLokAHJVXJgRfd7nbL7GRUNHgzbdu1Nfs9fVaFqw/edit?usp=sharing";

    // ============================================================
    // STATE
    // ============================================================
    let playlists = [];
    let currentPlaylist = null;
    let currentVideoIndex = -1;
    let shuffleMode = true;
    let isPlaying = false;
    let isPlaylistView = true; // true = showing playlists, false = showing videos
    let toastTimeout = null;

    // DOM refs
    const listContainer = document.getElementById('listContainer');
    const searchInput = document.getElementById('searchInput');
    const statusBadge = document.getElementById('statusBadge');
    const themeToggle = document.getElementById('themeToggle');
    const editBtn = document.getElementById('editBtn');
    const backBtn = document.getElementById('backBtn');
    const iframe = document.getElementById('playerIframe');
    const placeholder = document.getElementById('placeholder');
    const playerInfo = document.getElementById('playerInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playBtn = document.getElementById('playBtn');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const toast = document.getElementById('toast');

    // ============================================================
    // THEME
    // ============================================================
    let darkMode = true;
    function toggleTheme() {
        darkMode = !darkMode;
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
        themeToggle.textContent = darkMode ? '🌙' : '☀️';
        localStorage.setItem('shafin-theme', darkMode ? 'dark' : 'light');
    }
    const saved = localStorage.getItem('shafin-theme');
    if (saved === 'light') { darkMode = false; document.documentElement.setAttribute('data-theme', 'light'); themeToggle.textContent = '☀️'; }
    themeToggle.addEventListener('click', toggleTheme);

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(msg, duration = 2500) {
        if (toastTimeout) clearTimeout(toastTimeout);
        toast.textContent = msg;
        toast.classList.remove('hidden');
        toastTimeout = setTimeout(() => { toast.classList.add('hidden'); }, duration);
    }

    // ============================================================
    // LOAD FROM GOOGLE SHEET
    // ============================================================
    async function loadFromSheet() {
        statusBadge.textContent = '⏳ Loading...';
        try {
            const resp = await fetch(SHEET_CSV_URL);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const csv = await resp.text();
            const rows = csv.split(/\r?\n/).filter(r => r.trim());
            if (rows.length < 2) throw new Error('No data found');

            const parsed = [];
            for (let i = 1; i < rows.length; i++) {
                const fields = [];
                let current = '', inQuotes = false;
                for (const ch of rows[i]) {
                    if (ch === '"') inQuotes = !inQuotes;
                    else if (ch === ',' && !inQuotes) { fields.push(current.trim()); current = ''; }
                    else current += ch;
                }
                fields.push(current.trim());
                const clean = s => s.replace(/^["']|["']$/g, '').trim();
                const name = clean(fields[0] || '');
                const idsRaw = clean(fields[1] || '');
                const cover = clean(fields[2] || '');
                const link = clean(fields[3] || '');
                if (name && idsRaw) {
                    const videoIds = idsRaw.split(',').map(id => id.trim()).filter(id => id.length === 11);
                    if (videoIds.length > 0) {
                        parsed.push({ name, videoIds, cover, link });
                    }
                }
            }
            if (parsed.length === 0) throw new Error('No valid playlists found');
            playlists = parsed;
            statusBadge.textContent = `✅ ${playlists.length} playlists`;
            showToast(`Loaded ${playlists.length} playlists (${playlists.reduce((s,p) => s + p.videoIds.length, 0)} videos)`);
            renderPlaylists();
        } catch (err) {
            statusBadge.textContent = '❌ Failed';
            showToast('Error: ' + err.message, 4000);
            console.error(err);
            listContainer.innerHTML = `<div style="text-align:center; padding:40px 16px; font-size:0.75rem; color:var(--text2);">❌ ${err.message}</div>`;
        }
    }

    // ============================================================
    // RENDER FUNCTIONS
    // ============================================================
    function renderPlaylists() {
        isPlaylistView = true;
        backBtn.classList.remove('show');
        const search = searchInput.value.toLowerCase().trim();
        let filtered = playlists;
        if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));

        if (filtered.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; padding:40px 16px; font-size:0.75rem; color:var(--text2);">No playlists found</div>`;
            return;
        }

        let html = '';
        filtered.forEach((pl, idx) => {
            const isActive = currentPlaylist === pl && isPlaylistView;
            const firstLetter = pl.name.charAt(0).toUpperCase();
            html += `
                <div class="list-item ${isActive ? 'active' : ''}" data-index="${idx}" data-type="playlist">
                    <span class="icon">📋</span>
                    <div class="info">
                        <div class="title">${escapeHtml(pl.name)}</div>
                        <div class="sub">${pl.videoIds.length} videos</div>
                    </div>
                    <span class="video-count">${pl.videoIds.length}</span>
                </div>
            `;
        });
        listContainer.innerHTML = html;

        // Click handlers
        listContainer.querySelectorAll('.list-item[data-type="playlist"]').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.index);
                const pl = filtered[idx];
                if (pl) {
                    currentPlaylist = pl;
                    currentVideoIndex = -1;
                    renderVideos(pl);
                }
            });
        });
    }

    function renderVideos(playlist) {
        isPlaylistView = false;
        backBtn.classList.add('show');
        searchInput.placeholder = '🔍 Search videos...';
        const search = searchInput.value.toLowerCase().trim();

        let html = `<div style="padding:4px 8px; font-size:0.7rem; color:var(--text2); border-bottom:1px solid var(--border); margin-bottom:4px;">${escapeHtml(playlist.name)} (${playlist.videoIds.length})</div>`;
        let videos = playlist.videoIds.map((id, idx) => ({ id, index: idx }));
        if (search) {
            // Simple search: just filter by index or show all (no title search available)
            // We'll just show all with highlight
        }
        videos.forEach((v, idx) => {
            const isActive = currentVideoIndex === v.index;
            html += `
                <div class="list-item ${isActive ? 'active' : ''}" data-video-index="${v.index}" data-type="video">
                    <span class="icon">▶️</span>
                    <div class="info">
                        <div class="title">Video ${v.index + 1}</div>
                        <div class="sub">${escapeHtml(playlist.name)}</div>
                    </div>
                    <span class="badge">${v.index + 1}</span>
                </div>
            `;
        });
        listContainer.innerHTML = html;

        listContainer.querySelectorAll('.list-item[data-type="video"]').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.videoIndex);
                playVideo(playlist, idx);
            });
        });
    }

    function playVideo(playlist, videoIndex) {
        if (!playlist || videoIndex < 0 || videoIndex >= playlist.videoIds.length) return;
        currentPlaylist = playlist;
        currentVideoIndex = videoIndex;
        const videoId = playlist.videoIds[videoIndex];
        if (!videoId) return;

        // Show iframe, hide placeholder
        iframe.style.display = 'block';
        placeholder.style.display = 'none';
        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&enablejsapi=1`;
        isPlaying = true;
        playBtn.textContent = '⏸';
        playerInfo.textContent = `${playlist.name} • ${videoIndex+1}/${playlist.videoIds.length}`;
        showToast(`▶ ${playlist.name} • Video ${videoIndex+1}`);

        // Update active state in video list
        renderVideos(playlist);
    }

    function playRandomVideo(playlist) {
        if (!playlist || playlist.videoIds.length === 0) return;
        let idx;
        if (shuffleMode) {
            idx = Math.floor(Math.random() * playlist.videoIds.length);
        } else {
            idx = (currentVideoIndex + 1) % playlist.videoIds.length;
        }
        playVideo(playlist, idx);
    }

    function nextVideo() {
        if (!currentPlaylist) return;
        if (shuffleMode) {
            let idx;
            do {
                idx = Math.floor(Math.random() * currentPlaylist.videoIds.length);
            } while (currentPlaylist.videoIds.length > 1 && idx === currentVideoIndex);
            playVideo(currentPlaylist, idx);
        } else {
            const idx = (currentVideoIndex + 1) % currentPlaylist.videoIds.length;
            playVideo(currentPlaylist, idx);
        }
    }

    function prevVideo() {
        if (!currentPlaylist) return;
        if (shuffleMode) {
            let idx;
            do {
                idx = Math.floor(Math.random() * currentPlaylist.videoIds.length);
            } while (currentPlaylist.videoIds.length > 1 && idx === currentVideoIndex);
            playVideo(currentPlaylist, idx);
        } else {
            const idx = (currentVideoIndex - 1 + currentPlaylist.videoIds.length) % currentPlaylist.videoIds.length;
            playVideo(currentPlaylist, idx);
        }
    }

    function togglePlayPause() {
        if (!currentPlaylist) return;
        // YouTube iframe control via src reload (simplified)
        if (isPlaying) {
            iframe.src = iframe.src.replace('autoplay=1', 'autoplay=0');
            playBtn.textContent = '▶';
            isPlaying = false;
        } else {
            iframe.src = iframe.src.replace('autoplay=0', 'autoplay=1');
            playBtn.textContent = '⏸';
            isPlaying = true;
        }
    }

    function goBackToPlaylists() {
        isPlaylistView = true;
        backBtn.classList.remove('show');
        searchInput.placeholder = '🔍 Search playlists...';
        searchInput.value = '';
        renderPlaylists();
        // Don't reset player
    }

    // ============================================================
    // UTILITY
    // ============================================================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m] || m);
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    searchInput.addEventListener('input', () => {
        if (isPlaylistView) {
            renderPlaylists();
        } else {
            if (currentPlaylist) renderVideos(currentPlaylist);
        }
    });

    backBtn.addEventListener('click', goBackToPlaylists);

    prevBtn.addEventListener('click', prevVideo);
    nextBtn.addEventListener('click', nextVideo);
    playBtn.addEventListener('click', togglePlayPause);

    shuffleBtn.addEventListener('click', () => {
        shuffleMode = !shuffleMode;
        shuffleBtn.style.background = shuffleMode ? 'var(--accent)' : 'var(--bg3)';
        shuffleBtn.style.color = shuffleMode ? '#fff' : 'var(--text)';
        showToast(shuffleMode ? '🎲 Shuffle ON' : '➡️ Sequential');
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowRight') { e.preventDefault(); nextVideo(); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); prevVideo(); }
        if (e.key === ' ') { e.preventDefault(); togglePlayPause(); }
        if (e.key === 'Escape' && !isPlaylistView) { goBackToPlaylists(); }
        if (e.key === 's' || e.key === 'S') { shuffleBtn.click(); }
    });

    // When video ends, play next
    iframe.addEventListener('load', () => {
        // YouTube iframe doesn't fire 'ended' event easily, we'll use a timer or rely on user interaction
        // Simpler: let user control navigation
    });

    // Auto-play next when video ends (polling approach)
    let checkInterval = null;
    iframe.addEventListener('load', () => {
        if (checkInterval) clearInterval(checkInterval);
